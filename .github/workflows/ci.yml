name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        # Git Bash on Windows, so a bare `bash` in the tests is Git's, not WSL's
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # Below 3.15: its UTF-8 default hides the Windows code-page crashes the tests exist to catch
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: python3 on PATH (hooks start with it)
        if: runner.os == 'Windows'
        # setup-python usually ships python3.exe already; copy only when it doesn't
        run: command -v python3 || cp "$(dirname "$(which python)")/python.exe" "$(dirname "$(which python)")/python3.exe"
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python3 -m unittest discover -s tests -t tests

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
