name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 3.10, as in local runs (CONTRIBUTING): the oldest we test, so newer syntax fails here
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: git config --global user.email ci@example.com && git config --global user.name ci
      - run: python3 -m unittest discover -s tests -t tests
      # The Codex, Cursor and Antigravity files are built from the Claude Code sources; a stale one ships old behaviour
      - run: python3 scripts/hosts.py check

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate plugins/sdlc-stepper
      - run: claude plugin test plugins/sdlc-stepper
