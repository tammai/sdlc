</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="336" x2="340" y2="362"/>
<g class="decision"><rect x="230" y="362" width="220" height="56" rx="8"/>
<text class="t" x="340" y="381">Source files in repo?</text>
<text class="s" x="340" y="401">Unclear: ask you</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M230 390 L175 390 L175 450"/>
