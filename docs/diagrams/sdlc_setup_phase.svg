<text class="s" x="187.5" y="1317">index.md, log.md, folders</text>
</g>
<g class="action"><rect x="350" y="1284" width="285" height="44" rx="8"/>
<text class="t" x="492.5" y="1297">12 · Finalize</text>
<text class="s" x="492.5" y="1317">Lock marks setup complete</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="175" y1="1346" x2="175" y2="1376"/>
