<svg width="100%" viewBox="0 0 680 1236" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SDLC setup phase</title>
<desc>/sdlc:setup, or /sdlc:start when the project is not set up, opens the branch sdlc/setup and picks greenfield or brownfield by whether the repo has source files. Greenfield interviews, generates a skeleton, writes the justfile and CI. Brownfield detects, wraps existing commands, records a baseline, audits, and offers CI. Both then run the common steps and ask whether to open a PR or merge locally.</desc>
<style>
text{font-family:anthropic-sans,-apple-system,"system-ui","Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central}
.a{fill:none;stroke:#898781;stroke-width:1.5}
.t{font-size:14px;font-weight:500}
.s{font-size:12px}
.l{font-size:12px;fill:#52514e}
.l[text-anchor=start]{text-anchor:start}
.neutral rect{fill:#fcfcfb;stroke:rgba(11,11,11,.2);stroke-width:.5}
.neutral .t{fill:#0b0b0b}.neutral .s{fill:#52514e}
.decision rect{fill:#eeedfe;stroke:#534ab7;stroke-width:.5}
.decision .t{fill:#3c3489}.decision .s{fill:#534ab7}
.action rect{fill:#e1f5ee;stroke:#0f6e56;stroke-width:.5}
.action .t{fill:#085041}.action .s{fill:#0f6e56}
.approval rect{fill:#faece7;stroke:#993c1d;stroke-width:.5}
.approval .t{fill:#712b13}.approval .s{fill:#993c1d}
@media (prefers-color-scheme:dark){
.a{stroke:#a09e96}.l{fill:#aaa8a2}
.neutral rect{fill:#262624;stroke:rgba(255,255,255,.2)}.neutral .t{fill:#f0efea}.neutral .s{fill:#aaa8a2}
.decision rect{fill:#26244a;stroke:#a098f0}.decision .t{fill:#cecbfa}.decision .s{fill:#a098f0}
.action rect{fill:#0c3228;stroke:#5ac8a5}.action .t{fill:#aae6d4}.action .s{fill:#5ac8a5}
.approval rect{fill:#401e14;stroke:#e68c6e}.approval .t{fill:#f5c8b9}.approval .s{fill:#e68c6e}
}
.t[text-anchor=start]{text-anchor:start}
.panel{fill:none;stroke:rgba(11,11,11,.2);stroke-width:.5;stroke-dasharray:4 3}
.panel+text{fill:#0b0b0b}
@media (prefers-color-scheme:dark){.panel{stroke:rgba(255,255,255,.25)}.panel+text{fill:#f0efea}}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="neutral"><rect x="120" y="24" width="190" height="56" rx="8"/>
<text class="t" x="215.0" y="43">/sdlc:setup</text>
<text class="s" x="215.0" y="63">Explicit, re-runnable</text>
</g>
<g class="neutral"><rect x="370" y="24" width="190" height="56" rx="8"/>
<text class="t" x="465.0" y="43">/sdlc:start</text>
<text class="s" x="465.0" y="63">Not set up: hard stop</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M215 80 L215 93 L340 93 L340 106"/>
<path class="a" marker-end="url(#arrow)" d="M465 80 L465 93 L340 93 L340 106"/>
<g class="action"><rect x="210" y="106" width="260" height="56" rx="8"/>
<text class="t" x="340.0" y="125">Branch sdlc/setup</text>
<text class="s" x="340.0" y="145">One commit per step, resumable</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="162" x2="340" y2="192"/>
<g class="decision"><rect x="230" y="192" width="220" height="56" rx="8"/>
<text class="t" x="340.0" y="211">Source files in repo?</text>
<text class="s" x="340.0" y="231">Unclear: ask you</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M230 220 L175 220 L175 290"/>
<text class="l" x="175" y="208">no · greenfield</text>
<path class="a" marker-end="url(#arrow)" d="M450 220 L505 220 L505 290"/>
<text class="l" x="505" y="208">yes · brownfield</text>
<g class="approval"><rect x="30" y="290" width="290" height="56" rx="8"/>
<text class="t" x="175.0" y="309">Interview, propose stack</text>
<text class="s" x="175.0" y="329">You approve the skeleton</text>
</g>
<g class="action"><rect x="30" y="362" width="290" height="56" rx="8"/>
<text class="t" x="175.0" y="381">Generate skeleton</text>
<text class="s" x="175.0" y="401">Official generators, not presets</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="175" y1="346" x2="175" y2="362"/>
<g class="action"><rect x="30" y="434" width="290" height="56" rx="8"/>
<text class="t" x="175.0" y="453">Apply conventions</text>
<text class="s" x="175.0" y="473">Strict tsconfig, lint, test runner</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="175" y1="418" x2="175" y2="434"/>
<g class="action"><rect x="30" y="506" width="290" height="56" rx="8"/>
<text class="t" x="175.0" y="525">Write justfile</text>
<text class="s" x="175.0" y="545">Run just verify once: must pass</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="175" y1="490" x2="175" y2="506"/>
<g class="action"><rect x="30" y="578" width="290" height="56" rx="8"/>
<text class="t" x="175.0" y="597">CI workflow</text>
<text class="s" x="175.0" y="617">sdlc-verify.yml on PRs and main</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="175" y1="562" x2="175" y2="578"/>
<g class="action"><rect x="360" y="290" width="290" height="56" rx="8"/>
<text class="t" x="505.0" y="309">Detect</text>
<text class="s" x="505.0" y="329">Stack, workspaces, scripts, CI, AI config</text>
</g>
<g class="approval"><rect x="360" y="362" width="290" height="56" rx="8"/>
<text class="t" x="505.0" y="381">Wrap commands in a justfile</text>
<text class="s" x="505.0" y="401">You approve the diff; every recipe is run</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="505" y1="346" x2="505" y2="362"/>
<g class="action"><rect x="360" y="434" width="290" height="56" rx="8"/>
<text class="t" x="505.0" y="453">Record baseline</text>
<text class="s" x="505.0" y="473">Failing tests, lint counts: baseline.md</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="505" y1="418" x2="505" y2="434"/>
<g class="action"><rect x="360" y="506" width="290" height="56" rx="8"/>
<text class="t" x="505.0" y="516">Deep audit</text>
<text class="s" x="505.0" y="536">Parallel code-explorer agents</text>
<text class="s" x="505.0" y="554">Conventions, git history, ADRs, AI config</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="505" y1="490" x2="505" y2="506"/>
<g class="approval"><rect x="360" y="578" width="290" height="56" rx="8"/>
<text class="t" x="505.0" y="597">Review audit batches</text>
<text class="s" x="505.0" y="617">Nothing written without approval</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="505" y1="562" x2="505" y2="578"/>
<g class="action"><rect x="360" y="650" width="290" height="56" rx="8"/>
<text class="t" x="505.0" y="669">CI workflow</text>
<text class="s" x="505.0" y="689">Offered if none runs verify; existing kept</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="505" y1="634" x2="505" y2="650"/>
<rect class="panel" x="30" y="744" width="620" height="256" rx="10"/>
<text class="t" text-anchor="start" x="46" y="764">Common steps</text>
<line class="a" marker-end="url(#arrow)" x1="175" y1="634" x2="175" y2="744"/>
<line class="a" marker-end="url(#arrow)" x1="505" y1="706" x2="505" y2="744"/>
<g class="action"><rect x="45" y="782" width="285" height="44" rx="8"/>
<text class="t" x="187.5" y="795">Guardrails</text>
<text class="s" x="187.5" y="815">11 hookify rules, seeded</text>
</g>
<g class="action"><rect x="350" y="782" width="285" height="44" rx="8"/>
<text class="t" x="492.5" y="795">Allowlist</text>
<text class="s" x="492.5" y="815">just recipes in settings.json</text>
</g>
<g class="action"><rect x="45" y="836" width="285" height="44" rx="8"/>
<text class="t" x="187.5" y="849">.gitignore</text>
<text class="s" x="187.5" y="869">Adds .sdlc/.work/</text>
</g>
<g class="approval"><rect x="350" y="836" width="285" height="44" rx="8"/>
<text class="t" x="492.5" y="849">Constitution</text>
<text class="s" x="492.5" y="869">Inferred from repo, you approve</text>
</g>
<g class="action"><rect x="45" y="890" width="285" height="44" rx="8"/>
<text class="t" x="187.5" y="903">Knowledge skeleton</text>
<text class="s" x="187.5" y="923">index.md, log.md, folders</text>
</g>
<g class="action"><rect x="350" y="890" width="285" height="44" rx="8"/>
<text class="t" x="492.5" y="903">Policy rules</text>
<text class="s" x="492.5" y="923">.claude/rules/sdlc*.md, rendered</text>
</g>
<g class="action"><rect x="45" y="944" width="285" height="44" rx="8"/>
<text class="t" x="187.5" y="957">config.json</text>
<text class="s" x="187.5" y="977">Stack, verify commands, packages</text>
</g>
<g class="action"><rect x="350" y="944" width="285" height="44" rx="8"/>
<text class="t" x="492.5" y="957">scaffold.lock.json</text>
<text class="s" x="492.5" y="977">Versions, hashes, completed steps</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="1000" x2="340" y2="1030"/>
<g class="approval"><rect x="200" y="1030" width="280" height="56" rx="8"/>
<text class="t" x="340.0" y="1049">Ask you</text>
<text class="s" x="340.0" y="1069">Open a PR, or merge locally</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="1086" x2="340" y2="1116"/>
<g class="neutral"><rect x="200" y="1116" width="280" height="56" rx="8"/>
<text class="t" x="340.0" y="1135">Setup done</text>
<text class="s" x="340.0" y="1155">/sdlc:start continues your request</text>
</g>
<g class="decision"><rect x="190" y="1204" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="210" y="1211">Decision</text>
<g class="action"><rect x="300" y="1204" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="320" y="1211">Action</text>
<g class="approval"><rect x="400" y="1204" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="420" y="1211">Your approval</text>
</svg>
