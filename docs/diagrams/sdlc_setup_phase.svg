<text class="s" x="187.5" y="1101">Existing linter only; you approve</text>
</g>
<g class="action"><rect x="350" y="1068" width="285" height="44" rx="8"/>
<text class="t" x="492.5" y="1081">4 · Allowlist</text>
<text class="s" x="492.5" y="1101">Claude Code: commands in settings.json</text>
</g>
<g class="approval"><rect x="45" y="1122" width="285" height="44" rx="8"/>
<text class="t" x="187.5" y="1135">5 · Enable plugin for team</text>
<text class="s" x="187.5" y="1155">Claude Code: asks first</text>
</g>
<g class="approval"><rect x="350" y="1122" width="285" height="44" rx="8"/>
<text class="t" x="492.5" y="1135">6 · Context diet</text>
<text class="s" x="492.5" y="1155">Claude Code: asks to trim plugins</text>
</g>
<g class="action"><rect x="45" y="1176" width="285" height="44" rx="8"/>
