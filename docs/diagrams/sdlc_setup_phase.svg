</g>
<line class="a" marker-end="url(#arrow)" x1="505" y1="1634" x2="505" y2="1644"/>
<g class="approval"><rect x="375" y="1644" width="260" height="44" rx="8"/>
<text class="t" x="505" y="1657">Doctor, one commit, ask</text>
<text class="s" x="505" y="1677">Open a PR, or merge locally</text>
</g>
