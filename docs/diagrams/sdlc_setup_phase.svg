</g>
<line class="a" marker-end="url(#arrow)" x1="505" y1="578" x2="505" y2="594"/>
<g class="action"><rect x="360" y="594" width="290" height="56" rx="8"/>
<text class="t" x="505" y="613">Record baseline</text>
<text class="s" x="505" y="633">Run every command: baseline.md</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="505" y1="650" x2="505" y2="666"/>
<g class="action"><rect x="360" y="666" width="290" height="56" rx="8"/>
<text class="t" x="505" y="676">Deep audit</text>
<text class="s" x="505" y="696">Parallel code-explorer agents</text>
<text class="s" x="505" y="714">Conventions, git history, ADRs, areas</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="505" y1="722" x2="505" y2="738"/>
<g class="approval"><rect x="360" y="738" width="290" height="56" rx="8"/>
<text class="t" x="505" y="757">Review audit batches</text>
<text class="s" x="505" y="777">Nothing written without approval</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="505" y1="794" x2="505" y2="810"/>
<g class="approval"><rect x="360" y="810" width="290" height="56" rx="8"/>
<text class="t" x="505" y="829">Migrate AI config</text>
<text class="s" x="505" y="849">One diff per source; originals stay</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="505" y1="866" x2="505" y2="882"/>
<g class="approval"><rect x="360" y="882" width="290" height="56" rx="8"/>
<text class="t" x="505" y="901">Offer CI workflows</text>
<text class="s" x="505" y="921">If none verifies; existing CI kept</text>
</g>
<rect class="panel" x="30" y="976" width="620" height="370" rx="10"/>
<text class="t" text-anchor="start" x="46" y="996">Common steps</text>
<text class="l" text-anchor="start" x="162" y="996">Claude Code: only on that host; others record “not this agent”</text>
<line class="a" marker-end="url(#arrow)" x1="175" y1="722" x2="175" y2="976"/>
<line class="a" marker-end="url(#arrow)" x1="505" y1="938" x2="505" y2="976"/>
<g class="action"><rect x="45" y="1014" width="285" height="44" rx="8"/>
<text class="t" x="187.5" y="1027">1 · Policy rules</text>
<text class="s" x="187.5" y="1047">Claude Code: .claude/rules/sdlc*.md</text>
</g>
<g class="action"><rect x="350" y="1014" width="285" height="44" rx="8"/>
