<svg width="100%" viewBox="0 0 680 1770" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SDLC setup phase</title>
<desc>/sdlc:setting-up-projects, or /sdlc:start when the project is not set up, checks the setup state. A new or interrupted setup works on the branch sdlc/setup, records the config (asking where sdlc documents go when the repo builds a docs site), then picks greenfield or brownfield by whether the repo has source files. Greenfield: you approve a stack, it is generated with the official tools, its own commands are recorded in .sdlc/config.json and must pass, and the sdlc-verify and sdlc-invariants CI workflows are added. Brownfield: detect the stack, you approve the repo's own commands, record a baseline of what fails today, audit the codebase with parallel agents, and you approve each audit batch, each AI-config migration and the CI offer. Both then run twelve common steps: policy rules, 15 seeded hookify guardrails, a lint import only for a linter the project already has, the command allowlist, enabling the plugin for the team and trimming plugins (both asked first), the AGENTS.md block for Codex, Cursor and Antigravity, .gitignore, the constitution, a design system only when there is UI, the knowledge skeleton, and finalize. Rules, guardrails, allowlist, enable-plugin and context-diet run only in Claude Code. Setup ends by asking whether to open a PR or merge locally. A second agent joining a repo that is already set up runs Join instead: its own branch, add the host, its Claude Code layer if any, rebuild the AGENTS.md block, run doctor, one commit, and the same PR-or-merge question.</desc>
<style>
text{font-family:anthropic-sans,-apple-system,"system-ui","Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central}
.a{fill:none;stroke:#898781;stroke-width:1.5}
.t{font-size:14px;font-weight:500}
.s{font-size:12px}
.l{font-size:12px;fill:#52514e}
.l[text-anchor=start]{text-anchor:start}
.neutral rect{fill:#fcfcfb;stroke:rgba(11,11,11,.2);stroke-width:.5}
.neutral .t{fill:#0b0b0b}.neutral .s{fill:#52514e}
.decision rect{fill:#eeedfe;stroke:#534ab7;stroke-width:.5}
.decision .t{fill:#3c3489}.decision .s{fill:#534ab7}
.action rect{fill:#e1f5ee;stroke:#0f6e56;stroke-width:.5}
.action .t{fill:#085041}.action .s{fill:#0f6e56}
.approval rect{fill:#faece7;stroke:#993c1d;stroke-width:.5}
.approval .t{fill:#712b13}.approval .s{fill:#993c1d}
@media (prefers-color-scheme:dark){
.a{stroke:#a09e96}.l{fill:#aaa8a2}
.neutral rect{fill:#262624;stroke:rgba(255,255,255,.2)}.neutral .t{fill:#f0efea}.neutral .s{fill:#aaa8a2}
.decision rect{fill:#26244a;stroke:#a098f0}.decision .t{fill:#cecbfa}.decision .s{fill:#a098f0}
.action rect{fill:#0c3228;stroke:#5ac8a5}.action .t{fill:#aae6d4}.action .s{fill:#5ac8a5}
.approval rect{fill:#401e14;stroke:#e68c6e}.approval .t{fill:#f5c8b9}.approval .s{fill:#e68c6e}
}
.t[text-anchor=start]{text-anchor:start}
.panel{fill:none;stroke:rgba(11,11,11,.2);stroke-width:.5;stroke-dasharray:4 3}
.panel+text{fill:#0b0b0b}
@media (prefers-color-scheme:dark){.panel{stroke:rgba(255,255,255,.25)}.panel+text{fill:#f0efea}}</style>
