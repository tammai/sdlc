<text class="s" x="175" y="489">You approve stack, layout, extras</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="175" y1="506" x2="175" y2="522"/>
<g class="action"><rect x="30" y="522" width="290" height="56" rx="8"/>
<text class="t" x="175" y="541">Generate skeleton</text>
<text class="s" x="175" y="561">Official generators, one smoke test</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="175" y1="578" x2="175" y2="594"/>
<g class="action"><rect x="30" y="594" width="290" height="56" rx="8"/>
<text class="t" x="175" y="613">Record commands</text>
<text class="s" x="175" y="633">In config.json; each must exit 0</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="175" y1="650" x2="175" y2="666"/>
<g class="action"><rect x="30" y="666" width="290" height="56" rx="8"/>
<text class="t" x="175" y="685">CI workflows</text>
<text class="s" x="175" y="705">sdlc-verify + sdlc-invariants</text>
</g>
<g class="action"><rect x="360" y="450" width="290" height="56" rx="8"/>
<text class="t" x="505" y="469">Detect stack</text>
