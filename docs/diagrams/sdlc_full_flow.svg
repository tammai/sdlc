<g class="agent">
<rect x="120" y="1023" width="860" height="43" rx="6"/>
<text class="s" x="129" y="1037">Each chosen review runs once, fresh, never the builder's context (S/M code: built-in /code-review; else opus).</text>
<text class="s" x="129" y="1052">code-reviewer (code at the chosen depth; security) · ui-reviewer · the dependency audit runs in this session</text>
</g>
<g class="hook">
<rect x="120" y="1071" width="860" height="28" rx="6"/>
<text class="s" x="129" y="1085">verify-freshness blocks finishing on stale test results · prove-budget kills other commands at 120 s</text>
</g>
<g class="gate">
<rect x="120" y="1104" width="520" height="43" rx="6"/>
<text class="s" x="129" y="1118">Checked: every VERDICT PASS; Build's verify.py is reused. High →</text>
<text class="s" x="129" y="1133">back to Build, fixed test first at the rule, not rerun · rest ticketed</text>
</g>
<g class="approval">
<rect x="660" y="1104" width="320" height="43" rx="6"/>
<text class="s" x="669" y="1118">A reviewer and the builder disagree on a</text>
<text class="s" x="669" y="1133">high, or a waiver: you decide</text>
</g>
<g class="neutral">
<rect x="120" y="1152" width="860" height="28" rx="6"/>
<text class="s" x="129" y="1166">review.md: what was recommended and chosen, each verdict, the fixes and the tickets; if nothing ran, one line why</text>
</g>
