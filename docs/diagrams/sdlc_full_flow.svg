<text class="s" x="752" y="1058">saying so</text>
</g>
<g class="stage"><rect x="30" y="1120" width="110" height="68" rx="8"/><text class="t c" x="85.0" y="1146">9 Deploy</text><text class="s c" x="85.0" y="1164">L, on ask</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="1108" x2="85.0" y2="1120"/>
