<svg width="100%" viewBox="0 0 1000 1402" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SDLC with hooks, gates, skills and subagents</title>
<desc>The orchestrator runs stages 1 to 11. Each stage row shows the bundled skills, subagents and hooks involved and its exit gate; gates marked red need the user's approval. Five hook families run throughout: hookify, security-guidance, verify-freshness (Stage 5 only), model-router (checks each subagent's model and logs it while a feature is active; with role-guard, which keeps the plugin's agents to their role) and ralph-loop (optional).</desc>
<style>
text{font-family:anthropic-sans,-apple-system,"system-ui","Segoe UI",sans-serif;dominant-baseline:central;text-anchor:middle}
.a{fill:none;stroke:#898781;stroke-width:1.5}
.t{font-size:14px;font-weight:500;text-anchor:start}.s{font-size:12px;text-anchor:start}.c{text-anchor:middle!important}
.l{font-size:12px;fill:#52514e}.l[text-anchor=start]{text-anchor:start}
rect{stroke-width:.5}
.neutral rect{fill:#fcfcfb;stroke:rgba(11,11,11,.2)}.neutral .t{fill:#0b0b0b}.neutral .s{fill:#52514e}
.panel{fill:none;stroke:rgba(11,11,11,.2);stroke-dasharray:4 3}.panel+text{fill:#0b0b0b}
.stage rect{fill:#eeedfe;stroke:#534ab7}.stage .t{fill:#3c3489}.stage .s{fill:#534ab7}
.skill rect{fill:#e6f1fb;stroke:#185fa5}.skill .s{fill:#0c447c}
.agent rect{fill:#e1f5ee;stroke:#0f6e56}.agent .s{fill:#085041}
.hook rect{fill:#faeeda;stroke:#854f0b}.hook .t{fill:#633806}.hook .s{fill:#854f0b}
.gate rect{fill:#f1efe8;stroke:#5f5e5a}.gate .s{fill:#2c2c2a}
.approval rect{fill:#faece7;stroke:#993c1d}.approval .s{fill:#712b13}
@media (prefers-color-scheme:dark){
.a{stroke:#a09e96}.l{fill:#aaa8a2}
.neutral rect{fill:#262624;stroke:rgba(255,255,255,.2)}.neutral .t{fill:#f0efea}.neutral .s{fill:#aaa8a2}
.panel{stroke:rgba(255,255,255,.25)}.panel+text{fill:#f0efea}
.stage rect{fill:#26244a;stroke:#a098f0}.stage .t{fill:#cecbfa}.stage .s{fill:#a098f0}
.skill rect{fill:#102a44;stroke:#6aa8e6}.skill .s{fill:#b5d4f4}
.agent rect{fill:#0c3228;stroke:#5ac8a5}.agent .s{fill:#aae6d4}
.hook rect{fill:#3d2a10;stroke:#e0a04c}.hook .t{fill:#f5d9a8}.hook .s{fill:#e0a04c}
.gate rect{fill:#2e2d2a;stroke:#a09e96}.gate .s{fill:#d3d1c7}
.approval rect{fill:#401e14;stroke:#e68c6e}.approval .s{fill:#f5c8b9}
}
.hook .dim{fill:#633806}@media (prefers-color-scheme:dark){.hook .dim{fill:#f5d9a8}}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="neutral"><rect x="20" y="20" width="960" height="44" rx="8"/><text class="t c" x="500" y="36">/sdlc:start → orchestrator skill</text><text class="s c" x="500" y="54">Sizes the work, runs each stage, keeps .sdlc/&lt;feature&gt;/state.md, stops at gates</text></g>
<rect class="panel" x="20" y="80" width="960" height="188" rx="10"/>
<text class="t" x="34" y="98">Always on: hooks</text>
<g class="hook"><rect x="34" y="112" width="175" height="124" rx="8"/><text class="t" x="44" y="128">hookify</text><text class="s" x="44" y="148">PreToolUse · Prompt · Stop</text>
<text class="s dim" x="44" y="168">Blocks rm -rf, force-push</text>
<text class="s dim" x="44" y="184">to main, secret values.</text>
<text class="s dim" x="44" y="200">Warns on .only, console.log</text>
<text class="s dim" x="44" y="216">and comment noise.</text>
</g>
<g class="hook"><rect x="221" y="112" width="175" height="124" rx="8"/><text class="t" x="231" y="128">security-guidance</text><text class="s" x="231" y="148">Prompt · PostToolUse · Stop</text>
<text class="s dim" x="231" y="168">Pattern warnings on edits,</text>
<text class="s dim" x="231" y="184">diff review at turn end,</text>
<text class="s dim" x="231" y="200">agentic review on git</text>
<text class="s dim" x="231" y="216">commit and git push.</text>
</g>
<g class="hook"><rect x="408" y="112" width="175" height="124" rx="8"/><text class="t" x="418" y="128">verify-freshness</text><text class="s" x="418" y="148">PostToolUse · Stop · Stage 5</text>
<text class="s dim" x="418" y="168">Edits mark tests stale,</text>
<text class="s dim" x="418" y="184">a full run marks them</text>
<text class="s dim" x="418" y="200">fresh. Blocks finishing</text>
<text class="s dim" x="418" y="216">while stale.</text>
</g>
<g class="hook"><rect x="595" y="112" width="175" height="124" rx="8"/><text class="t" x="605" y="128">model-router</text><text class="s" x="605" y="148">PreToolUse · Agent</text>
<text class="s dim" x="605" y="168">Every subagent names a</text>
<text class="s dim" x="605" y="184">model. Fable only on</text>
<text class="s dim" x="605" y="200">request; opus reviewers</text>
<text class="s dim" x="605" y="216">on Risk: high.</text>
</g>
<g class="hook"><rect x="782" y="112" width="175" height="124" rx="8"/><text class="t" x="792" y="128">ralph-loop</text><text class="s" x="792" y="148">Stop · /sdlc:ralph-loop</text>
<text class="s dim" x="792" y="168">Re-feeds the task until</text>
<text class="s dim" x="792" y="184">the completion promise</text>
<text class="s dim" x="792" y="200">or max iterations.</text>
<text class="s dim" x="792" y="216">Optional, Stage 4.</text>
</g>
<text class="l" x="34" y="254" text-anchor="start">SessionStart: bootstraps the Agent SDK for the commit reviewer</text>
<text class="l" x="85.0" y="288">Stage</text>
<text class="l" x="255.0" y="288">Skills</text>
<text class="l" x="468.0" y="288">Subagents</text>
<text class="l" x="654.0" y="288">Hooks that matter here</text>
<text class="l" x="861.0" y="288">Gate</text>
<g class="stage"><rect x="30" y="304" width="110" height="84" rx="8"/><text class="t c" x="85.0" y="338">1 Discover</text><text class="s c" x="85.0" y="356">M, L</text></g>
<g class="skill"><rect x="148" y="304" width="214" height="84" rx="6"/>
<text class="s" x="158" y="322">brainstorming (L only)</text>
<text class="s" x="158" y="338">writing-specs</text>
<text class="s" x="158" y="354">clarifying-specs</text>
<text class="s" x="158" y="370">reads knowledge/index.md</text>
</g>
<text class="l" x="468.0" y="346">none</text>
<text class="l" x="654.0" y="346">no extra hooks</text>
<g class="approval"><rect x="742" y="304" width="238" height="84" rx="6"/>
<text class="s" x="752" y="322">You approve: checklist passes, no</text>
<text class="s" x="752" y="338">open clarifications or [inferred]</text>
<text class="s" x="752" y="354">items, Non-Goals filled, criteria</text>
<text class="s" x="752" y="370">testable</text>
</g>
<g class="stage"><rect x="30" y="400" width="110" height="84" rx="8"/><text class="t c" x="85.0" y="434">2 Design</text><text class="s c" x="85.0" y="452">L, M if unclear</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="388" x2="85.0" y2="400"/>
<g class="skill"><rect x="148" y="400" width="214" height="84" rx="6"/>
<text class="s" x="158" y="418">designing-solutions</text>
</g>
<g class="agent"><rect x="370" y="400" width="196" height="84" rx="6"/>
<text class="s" x="380" y="418">code-explorer</text>
<text class="s" x="380" y="434">code-architect</text>
</g>
<text class="l" x="654.0" y="442">no extra hooks</text>
<g class="approval"><rect x="742" y="400" width="238" height="84" rx="6"/>
<text class="s" x="752" y="418">You approve: every FR/SC maps to</text>
<text class="s" x="752" y="434">the design, each Complexity row</text>
<text class="s" x="752" y="450">cites a requirement, constitution</text>
<text class="s" x="752" y="466">check passes</text>
</g>
<g class="stage"><rect x="30" y="496" width="110" height="84" rx="8"/><text class="t c" x="85.0" y="530">3 Plan</text><text class="s c" x="85.0" y="548">M, L</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="484" x2="85.0" y2="496"/>
<g class="skill"><rect x="148" y="496" width="214" height="84" rx="6"/>
<text class="s" x="158" y="514">writing-plans</text>
<text class="s" x="158" y="530">analyzing-consistency (L, or</text>
<text class="s" x="158" y="546">M with over ~8 tasks)</text>
</g>
<text class="l" x="468.0" y="538">none</text>
<text class="l" x="654.0" y="538">no extra hooks</text>
<g class="approval"><rect x="742" y="496" width="238" height="84" rx="6"/>
<text class="s" x="752" y="514">No CRITICAL/HIGH scope findings,</text>
<text class="s" x="752" y="530">every task cites a requirement,</text>
<text class="s" x="752" y="546">Public Surface declared. You pick</text>
<text class="s" x="752" y="562">the execution method</text>
</g>
<g class="stage"><rect x="30" y="592" width="110" height="116" rx="8"/><text class="t c" x="85.0" y="642">4 Implement</text><text class="s c" x="85.0" y="660">S, M, L</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="580" x2="85.0" y2="592"/>
<g class="skill"><rect x="148" y="592" width="214" height="116" rx="6"/>
<text class="s" x="158" y="610">using-git-worktrees (L)</text>
<text class="s" x="158" y="626">subagent-driven-development or</text>
<text class="s" x="158" y="642">executing-plans (inline)</text>
<text class="s" x="158" y="658">dispatching-parallel-agents</text>
<text class="s" x="158" y="674">test-driven-development</text>
<text class="s" x="158" y="690">systematic-debugging on failure</text>
</g>
<g class="agent"><rect x="370" y="592" width="196" height="116" rx="6"/>
<text class="s" x="380" y="610">implementer, one per task</text>
<text class="s" x="380" y="626">task reviewer after each</text>
<text class="s" x="380" y="642">branch reviewer at the end</text>
</g>
<g class="hook"><rect x="574" y="592" width="160" height="116" rx="6"/>
<text class="s" x="584" y="610">hookify guardrails</text>
<text class="s" x="584" y="626">security: edit warnings</text>
<text class="s" x="584" y="642">ralph-loop (optional)</text>
<text class="s" x="584" y="658">model-router: models</text>
</g>
<g class="gate"><rect x="742" y="592" width="238" height="116" rx="6"/>
<text class="s" x="752" y="610">Every plan task checked, build and</text>
<text class="s" x="752" y="626">full tests pass, no TODO without</text>
<text class="s" x="752" y="642">a ticket</text>
</g>
<g class="stage"><rect x="30" y="720" width="110" height="84" rx="8"/><text class="t c" x="85.0" y="754">5 Verify</text><text class="s c" x="85.0" y="772">S, M, L</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="708" x2="85.0" y2="720"/>
<g class="skill"><rect x="148" y="720" width="214" height="84" rx="6"/>
<text class="s" x="158" y="738">verification-before-completion</text>
<text class="s" x="158" y="754">systematic-debugging on a fail</text>
</g>
<g class="agent"><rect x="370" y="720" width="196" height="84" rx="6"/>
<text class="s" x="380" y="738">verifier (new each round)</text>
<text class="s" x="380" y="754">pr-test-analyzer (M, L)</text>
<text class="s" x="380" y="770">silent-failure-hunter (M, L)</text>
<text class="s" x="380" y="786">qa-tester on request</text>
</g>
<g class="hook"><rect x="574" y="720" width="160" height="84" rx="6"/>
<text class="s" x="584" y="738">verify-freshness: stale</text>
<text class="s" x="584" y="754">on edit, fresh on full</text>
<text class="s" x="584" y="770">run, blocks Stop</text>
<text class="s" x="584" y="786">router, role-guard: verifier</text>
</g>
<g class="gate"><rect x="742" y="720" width="238" height="84" rx="6"/>
<text class="s" x="752" y="738">Verifier PASS on this commit,</text>
<text class="s" x="752" y="754">no test gap ≥ 8, no high silent</text>
<text class="s" x="752" y="770">failure. Fail: back to Stage 4.</text>
<text class="s" x="752" y="786">Round 3 fails: ask you</text>
</g>
<g class="stage"><rect x="30" y="816" width="110" height="116" rx="8"/><text class="t c" x="85.0" y="866">6 Review</text><text class="s c" x="85.0" y="884">S, M, L</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="804" x2="85.0" y2="816"/>
<g class="skill"><rect x="148" y="816" width="214" height="116" rx="6"/>
<text class="s" x="158" y="834">requesting-code-review</text>
<text class="s" x="158" y="850">receiving-code-review</text>
<text class="s" x="158" y="866">diff_stats.py for reviewers</text>
</g>
<g class="agent"><rect x="370" y="816" width="196" height="116" rx="6"/>
<text class="s" x="380" y="834">/sdlc:review-pr picks from:</text>
<text class="s" x="380" y="850">code-reviewer, comment-</text>
<text class="s" x="380" y="866">analyzer, pr-test-analyzer,</text>
<text class="s" x="380" y="882">type-design-analyzer,</text>
<text class="s" x="380" y="898">silent-failure-hunter,</text>
<text class="s" x="380" y="914">code-simplifier, ui-reviewer</text>
</g>
<text class="l" x="654.0" y="874">no extra hooks</text>
<g class="gate"><rect x="742" y="816" width="238" height="116" rx="6"/>
<text class="s" x="752" y="834">No unresolved high finding; others</text>
<text class="s" x="752" y="850">fixed or ticketed in review.md.</text>
<text class="s" x="752" y="866">Unrequested public surface is high</text>
</g>
<g class="stage"><rect x="30" y="944" width="110" height="68" rx="8"/><text class="t c" x="85.0" y="970">7 Security</text><text class="s c" x="85.0" y="988">M light, L</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="932" x2="85.0" y2="944"/>
<g class="skill"><rect x="148" y="944" width="214" height="68" rx="6"/>
<text class="s" x="158" y="962">Security-only reviewer brief</text>
<text class="s" x="158" y="978">dependency audit per stack</text>
</g>
<g class="agent"><rect x="370" y="944" width="196" height="68" rx="6"/>
<text class="s" x="380" y="962">feature-reviewer</text>
<text class="s" x="380" y="978">code-reviewer (security)</text>
</g>
<g class="hook"><rect x="574" y="944" width="160" height="68" rx="6"/>
<text class="s" x="584" y="962">security-guidance: edit</text>
<text class="s" x="584" y="978">warnings, turn-end diff</text>
<text class="s" x="584" y="994">review, commit review</text>
</g>
<g class="gate"><rect x="742" y="944" width="238" height="68" rx="6"/>
<text class="s" x="752" y="962">No critical or high open, no secrets</text>
<text class="s" x="752" y="978">in the diff; written to security.md</text>
</g>
<g class="stage"><rect x="30" y="1024" width="110" height="84" rx="8"/><text class="t c" x="85.0" y="1058">8 PR / CI</text><text class="s c" x="85.0" y="1076">S, M, L</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="1012" x2="85.0" y2="1024"/>
<g class="skill"><rect x="148" y="1024" width="214" height="84" rx="6"/>
<text class="s" x="158" y="1042">finishing-a-development-branch</text>
<text class="s" x="158" y="1058">/sdlc:commit-push-pr</text>
<text class="s" x="158" y="1074">/sdlc:code-review on the PR</text>
</g>
<g class="agent"><rect x="370" y="1024" width="196" height="84" rx="6"/>
