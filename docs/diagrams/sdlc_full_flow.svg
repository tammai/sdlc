<g class="skill">
<rect x="120" y="717" width="860" height="28" rx="6"/>
<text class="s" x="129" y="731">test-driven-development · systematic-debugging the moment something fails unexpectedly</text>
</g>
<g class="neutral">
<rect x="120" y="750" width="860" height="43" rx="6"/>
<text class="s" x="129" y="764">Like plain Claude, no review agents: each AC's test recorded red first (verify.py red AC-nnn), then its code.</text>
<text class="s" x="129" y="779">It builds from the must-never-break lines and failure modes too, not only the ACs; a crash window in a write is must-fix.</text>
</g>
