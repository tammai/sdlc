<svg width="100%" viewBox="0 0 1000 1505" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SDLC tracks by phase</title>
<desc>The orchestrator's three tracks side by side, by phase (Define, Build, Review, Ship with Learn), sdlc 2.0. Every track writes the same record: intent.md, spec.md (each acceptance criterion with its test) and plan.md in Define, review.md in Review. Define asks only when what, why or how is unclear, one question at a time; a bug is proven first (a failing test or exact steps) and its root cause found. S, a fix: the three files a few lines each, no stop; Build in the session, each criterion's test red first, then verify.py; Review runs the reviews the agent recommends, or none, and says so. M, a feature: the three files in full, which you read and approve; Build in the session; Review stops with a recommendation and you pick. L, a project: the same as M, with the interview run by brainstorming, and the build may run in parts in fresh sessions or as parallel subagents. The recommended reviews: security, code at default or high depth, UI (always when the diff touches UI files), the advisor where there is one, or none; each runs once, fresh (the code review on S and M: Claude Code's built-in /code-review; the rest on opus), and its high findings go back to Build, fixed test first. Ship, on every track: Learn files lessons and recurring defects before the final commit, verify.py green on that code, push, open the PR, watch CI with one fix, then stop at the PR; merge waits for the user. hookify, security-guidance, model-router, role-guard and trust-anchor run on every track; verify-freshness and prove-budget only in Review. Parts land together: one Review and one Ship after the last part. Deploy is the on-request /sdlc:deploy, not a phase.</desc>
