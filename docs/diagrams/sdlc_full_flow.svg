<svg width="100%" viewBox="0 0 1000 1030" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SDLC with hooks, gates, skills and subagents</title>
<desc>The orchestrator runs four phases: Define, Build, Prove, and Ship with Learn at the end of every feature. Each phase row shows the bundled skills, subagents and hooks involved and its exit gate; gates marked red need the user's approval. Define ends in one approval (none on S, which writes no documents, only Intent: and Repro: lines in its state file); Build records each acceptance criterion's test failing before its code and ends with one passing verify.py run; Prove reuses that run (or reruns it once) and runs the checkers the track needs in one parallel round on one commit: S dispatches none, M lite one fresh ac-checker that reads each test against its criterion, M full adds one light code-reviewer, L the top-tier reviewers and full security. Ship commits on a feature branch without asking on S and lite, and asks merge, PR or keep on full and L. Backlog slices loop Build, Prove and a commit, then a feature close runs Prove and Ship. Deploy is the on-request command /sdlc:deploy, not a phase; Operate is gone. Five hook families run throughout: hookify, security-guidance, verify-freshness and prove-budget (Prove only), model-router (checks each subagent's model, never haiku, and logs it while a feature is active; with role-guard, which keeps the plugin's agents to their role, and trust-anchor, which tells the user when what verification trusts changes) and ralph-loop (optional, Build, from the sdlc-extras companion plugin).</desc>
<style>
text{font-family:anthropic-sans,-apple-system,"system-ui","Segoe UI",sans-serif;dominant-baseline:central;text-anchor:middle}
.a{fill:none;stroke:#898781;stroke-width:1.5}
.t{font-size:14px;font-weight:500;text-anchor:start}.s{font-size:12px;text-anchor:start}.c{text-anchor:middle!important}
.l{font-size:12px;fill:#52514e}.l[text-anchor=start]{text-anchor:start}
rect{stroke-width:.5}
.neutral rect{fill:#fcfcfb;stroke:rgba(11,11,11,.2)}.neutral .t{fill:#0b0b0b}.neutral .s{fill:#52514e}
.panel{fill:none;stroke:rgba(11,11,11,.2);stroke-dasharray:4 3}.panel+text{fill:#0b0b0b}
.stage rect{fill:#eeedfe;stroke:#534ab7}.stage .t{fill:#3c3489}.stage .s{fill:#534ab7}
.skill rect{fill:#e6f1fb;stroke:#185fa5}.skill .s{fill:#0c447c}
.agent rect{fill:#e1f5ee;stroke:#0f6e56}.agent .s{fill:#085041}
.hook rect{fill:#faeeda;stroke:#854f0b}.hook .t{fill:#633806}.hook .s{fill:#854f0b}
.gate rect{fill:#f1efe8;stroke:#5f5e5a}.gate .s{fill:#2c2c2a}
.approval rect{fill:#faece7;stroke:#993c1d}.approval .s{fill:#712b13}
@media (prefers-color-scheme:dark){
.a{stroke:#a09e96}.l{fill:#aaa8a2}
.neutral rect{fill:#262624;stroke:rgba(255,255,255,.2)}.neutral .t{fill:#f0efea}.neutral .s{fill:#aaa8a2}
.panel{stroke:rgba(255,255,255,.25)}.panel+text{fill:#f0efea}
.stage rect{fill:#26244a;stroke:#a098f0}.stage .t{fill:#cecbfa}.stage .s{fill:#a098f0}
.skill rect{fill:#102a44;stroke:#6aa8e6}.skill .s{fill:#b5d4f4}
.agent rect{fill:#0c3228;stroke:#5ac8a5}.agent .s{fill:#aae6d4}
.hook rect{fill:#3d2a10;stroke:#e0a04c}.hook .t{fill:#f5d9a8}.hook .s{fill:#e0a04c}
.gate rect{fill:#2e2d2a;stroke:#a09e96}.gate .s{fill:#d3d1c7}
.approval rect{fill:#401e14;stroke:#e68c6e}.approval .s{fill:#f5c8b9}
}
.hook .dim{fill:#633806}@media (prefers-color-scheme:dark){.hook .dim{fill:#f5d9a8}}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="neutral"><rect x="20" y="20" width="960" height="44" rx="8"/><text class="t c" x="500" y="36">/sdlc:start → orchestrator skill</text><text class="s c" x="500" y="54">Sizes the work, runs each phase, keeps .sdlc/state/&lt;feature&gt;.md, stops at gates</text></g>
<rect class="panel" x="20" y="80" width="960" height="188" rx="10"/>
<text class="t" x="34" y="98">Always on: hooks</text>
<g class="hook"><rect x="34" y="112" width="175" height="124" rx="8"/><text class="t" x="44" y="128">hookify</text><text class="s" x="44" y="148">PreToolUse · Prompt · Stop</text>
<text class="s dim" x="44" y="168">Blocks rm -rf, force-push</text>
<text class="s dim" x="44" y="184">to main, secret values.</text>
<text class="s dim" x="44" y="200">Warns on .only, console.log</text>
<text class="s dim" x="44" y="216">and comment noise.</text>
</g>
<g class="hook"><rect x="221" y="112" width="175" height="124" rx="8"/><text class="t" x="231" y="128">security-guidance</text><text class="s" x="231" y="148">Prompt · PostToolUse · Stop</text>
<text class="s dim" x="231" y="168">Pattern warnings on edits,</text>
<text class="s dim" x="231" y="184">diff review at turn end,</text>
<text class="s dim" x="231" y="200">agentic review on git</text>
<text class="s dim" x="231" y="216">commit and git push.</text>
</g>
<g class="hook"><rect x="408" y="112" width="175" height="124" rx="8"/><text class="t" x="418" y="128">verify-freshness</text><text class="s" x="418" y="148">PostToolUse · Stop · Prove</text>
<text class="s dim" x="418" y="168">Edits mark tests stale,</text>
<text class="s dim" x="418" y="184">a full run marks them</text>
<text class="s dim" x="418" y="200">fresh. Blocks finishing</text>
<text class="s dim" x="418" y="216">while stale.</text>
</g>
<g class="hook"><rect x="595" y="112" width="175" height="124" rx="8"/><text class="t" x="605" y="128">model-router</text><text class="s" x="605" y="148">PreToolUse · Agent</text>
<text class="s dim" x="605" y="168">Every subagent names a</text>
<text class="s dim" x="605" y="184">model. Fable only on</text>
<text class="s dim" x="605" y="200">request; never haiku;</text>
<text class="s dim" x="605" y="216">opus reviewers on L.</text>
</g>
<g class="hook"><rect x="782" y="112" width="175" height="124" rx="8"/><text class="t" x="792" y="128">ralph-loop</text><text class="s" x="792" y="148">Stop · sdlc-extras</text>
<text class="s dim" x="792" y="168">Re-feeds the task until</text>
<text class="s dim" x="792" y="184">the completion promise</text>
<text class="s dim" x="792" y="200">or max iterations.</text>
<text class="s dim" x="792" y="216">Optional, Build.</text>
</g>
<text class="l" x="34" y="254" text-anchor="start">SessionStart: bootstraps the Agent SDK for the commit reviewer</text>
<text class="l" x="85.0" y="288">Phase</text>
<text class="l" x="255.0" y="288">Skills</text>
<text class="l" x="468.0" y="288">Subagents</text>
<text class="l" x="654.0" y="288">Hooks that matter here</text>
<text class="l" x="861.0" y="288">Gate</text>
<g class="stage"><rect x="30" y="304" width="110" height="148" rx="8"/><text class="t c" x="85.0" y="354">Define</text><text class="s c" x="85.0" y="372">S: no docs, no</text><text class="s c" x="85.0" y="388">approval</text><text class="s c" x="85.0" y="404">all: + spec, plan</text></g>
<g class="skill"><rect x="148" y="304" width="214" height="148" rx="6"/>
<text class="s" x="158" y="322">reads knowledge/index.md and</text>
<text class="s" x="158" y="338">recurring-defects.md</text>
<text class="s" x="158" y="354">brainstorming (L)</text>
<text class="s" x="158" y="370">writing-specs / -plans (full)</text>
<text class="s" x="158" y="386">designing-solutions (L, or M</text>
<text class="s" x="158" y="402">with a non-obvious approach)</text>
<text class="s" x="158" y="418">analyzing-consistency (L,</text>
<text class="s" x="158" y="434">or a backlog)</text>
</g>
<g class="agent"><rect x="370" y="304" width="196" height="148" rx="6"/>
<text class="s" x="380" y="322">code-explorer</text>
<text class="s" x="380" y="338">code-architect</text>
<text class="s" x="380" y="354">(only when a design runs)</text>
</g>
<text class="l" x="654.0" y="378">no extra hooks</text>
<g class="approval"><rect x="742" y="304" width="238" height="148" rx="6"/>
<text class="s" x="752" y="322">You approve once (not on S): the</text>
<text class="s" x="752" y="338">intent, spec, plan, or a backlog;</text>
<text class="s" x="752" y="354">no [inferred] left, Non-Goals</text>
<text class="s" x="752" y="370">filled, criteria testable, every</text>
<text class="s" x="752" y="386">FR has a task, Public Surface</text>
<text class="s" x="752" y="402">declared, design criteria hold.</text>
<text class="s" x="752" y="418">Build: method shown, not asked</text>
</g>
<g class="stage"><rect x="30" y="464" width="110" height="116" rx="8"/><text class="t c" x="85.0" y="514">Build</text><text class="s c" x="85.0" y="532">S, M, L</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="452" x2="85.0" y2="464"/>
<g class="skill"><rect x="148" y="464" width="214" height="116" rx="6"/>
<text class="s" x="158" y="482">using-git-worktrees (L, dirty tree)</text>
<text class="s" x="158" y="498">test-driven-development</text>
<text class="s" x="158" y="514">systematic-debugging on failure</text>
<text class="s" x="158" y="530">subagent-driven-development</text>
<text class="s" x="158" y="546">(Build: subagent or tasks)</text>
<text class="s" x="158" y="562">dispatching-parallel-agents</text>
</g>
<g class="agent"><rect x="370" y="464" width="196" height="116" rx="6"/>
<text class="s" x="380" y="482">Build from the track:</text>
<text class="s" x="380" y="498">native: none, this session</text>
<text class="s" x="380" y="514">subagent: one implementer</text>
<text class="s" x="380" y="530">tasks: implementer and</text>
<text class="s" x="380" y="546">reviewer per task</text>
</g>
<g class="hook"><rect x="574" y="464" width="160" height="116" rx="6"/>
<text class="s" x="584" y="482">hookify guardrails</text>
<text class="s" x="584" y="498">security: edit warnings</text>
<text class="s" x="584" y="514">ralph-loop (optional)</text>
<text class="s" x="584" y="530">model-router: models</text>
</g>
<g class="gate"><rect x="742" y="464" width="238" height="116" rx="6"/>
<text class="s" x="752" y="482">Every task done, verify.py</text>
<text class="s" x="752" y="498">passes: each AC test red first,</text>
<text class="s" x="752" y="514">then green; drift recorded; no</text>
<text class="s" x="752" y="530">TODO without a ticket</text>
</g>
<g class="stage"><rect x="30" y="592" width="110" height="148" rx="8"/><text class="t c" x="85.0" y="642">Prove</text><text class="s c" x="85.0" y="660">verify, review,</text><text class="s c" x="85.0" y="676">security</text><text class="s c" x="85.0" y="692">S, M, L</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="580" x2="85.0" y2="592"/>
<g class="skill"><rect x="148" y="592" width="214" height="148" rx="6"/>
<text class="s" x="158" y="610">verification-before-completion</text>
<text class="s" x="158" y="626">systematic-debugging on a fail</text>
<text class="s" x="158" y="642">diff_stats.py for reviewers</text>
<text class="s" x="158" y="658">receiving-code-review</text>
<text class="s" x="158" y="674">security-only brief (full)</text>
<text class="s" x="158" y="690">dependency audit per stack</text>
</g>
<g class="agent"><rect x="370" y="592" width="196" height="148" rx="6"/>
<text class="s" x="380" y="610">One parallel round, one commit:</text>
<text class="s" x="380" y="626">ac-checker (M, L; none on S)</text>
<text class="s" x="380" y="642">code-reviewer (M full: light)</text>
<text class="s" x="380" y="658">qa-tester (Feature close)</text>
<text class="s" x="380" y="674">silent-failure-hunter (L)</text>
<text class="s" x="380" y="690">pr-test-analyzer (L)</text>
<text class="s" x="380" y="706">ui-reviewer on UI diffs</text>
<text class="s" x="380" y="722">feature-reviewer (security)</text>
</g>
<g class="hook"><rect x="574" y="592" width="160" height="148" rx="6"/>
<text class="s" x="584" y="610">verify-freshness: stale</text>
<text class="s" x="584" y="626">on edit, fresh on full</text>
<text class="s" x="584" y="642">run, blocks Stop</text>
<text class="s" x="584" y="658">security-guidance</text>
<text class="s" x="584" y="674">router, role-guard:</text>
<text class="s" x="584" y="690">ac-checker, reviewers</text>
</g>
<g class="gate"><rect x="742" y="592" width="238" height="148" rx="6"/>
<text class="s" x="752" y="610">verify.py + ac-checker PASS (S:</text>
<text class="s" x="752" y="626">verify.py) on this code, every</text>
<text class="s" x="752" y="642">AC proven, no unresolved high</text>
<text class="s" x="752" y="658">finding, no test gap ≥ 8 (L), no</text>
<text class="s" x="752" y="674">critical or high security, no</text>
<text class="s" x="752" y="690">secrets. Fixes go together, one</text>
<text class="s" x="752" y="706">re-verification. Round 3 fails,</text>
<text class="s" x="752" y="722">or a need fails twice: ask you</text>
</g>
<g class="stage"><rect x="30" y="752" width="110" height="132" rx="8"/><text class="t c" x="85.0" y="802">Ship</text><text class="s c" x="85.0" y="820">+ Learn</text><text class="s c" x="85.0" y="836">S, M, L</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="740" x2="85.0" y2="752"/>
<g class="skill"><rect x="148" y="752" width="214" height="132" rx="6"/>
<text class="s" x="158" y="770">Learn: recurring-defects.md;</text>
<text class="s" x="158" y="786">managing-knowledge, /sdlc:</text>
<text class="s" x="158" y="802">hookify only for a durable</text>
<text class="s" x="158" y="818">lesson; retro.md (L)</text>
<text class="s" x="158" y="834">/sdlc:commit, one commit</text>
<text class="s" x="158" y="850">finishing-a-development-branch</text>
<text class="s" x="158" y="866">/sdlc:commit-push-pr</text>
</g>
<g class="agent"><rect x="370" y="752" width="196" height="132" rx="6"/>
<text class="s" x="380" y="770">conversation-analyzer</text>
<text class="s" x="380" y="786">(sdlc-extras, /hookify)</text>
<text class="s" x="380" y="802">/sdlc:code-review agents</text>
<text class="s" x="380" y="818">on a PR, on request</text>
</g>
<g class="hook"><rect x="574" y="752" width="160" height="132" rx="6"/>
<text class="s" x="584" y="770">security: review on</text>
<text class="s" x="584" y="786">commit and push</text>
<text class="s" x="584" y="802">hookify: no force-push</text>
<text class="s" x="584" y="818">to main</text>
</g>
<g class="approval"><rect x="742" y="752" width="238" height="132" rx="6"/>
<text class="s" x="752" y="770">Verified tree clean, Learn done,</text>
<text class="s" x="752" y="786">CI green. Full, L: you pick merge,</text>
<text class="s" x="752" y="802">PR, keep. S, lite: branch commit.</text>
<text class="s" x="752" y="818">Then Status: done</text>
</g>
<path class="a loop" marker-end="url(#arrow)" d="M30 666 L20 666 L20 522 L28 522"/>
<text class="l" transform="rotate(-90 9 594)" x="9" y="594">step back</text>
<text class="l" x="34" y="900" text-anchor="start">Backlog: each slice runs Build → Prove → one commit; once every slice is done, a feature close runs Prove on the whole branch, then Ship.</text>
<g class="neutral"><rect x="20" y="920" width="960" height="52" rx="8" style="stroke-dasharray:4 3"/><text class="t" x="34" y="937">/sdlc:deploy · on request, not a phase</text><text class="s" x="34" y="956">Project's own deploy path · your go-ahead before a production deploy or DB migration · smoke test · release.md with the rollback step</text></g>
<g class="stage"><rect x="30" y="996" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="50" y="1003">Phase</text>
<g class="skill"><rect x="130" y="996" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="150" y="1003">Skill</text>
<g class="agent"><rect x="220" y="996" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="240" y="1003">Subagent</text>
<g class="hook"><rect x="330" y="996" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="350" y="1003">Hook</text>
<g class="gate"><rect x="410" y="996" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="430" y="1003">Gate, checked</text>
<g class="approval"><rect x="550" y="996" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="570" y="1003">Gate, you approve</text>
</svg>
