<g class="stage"><rect x="30" y="1264" width="110" height="84" rx="8"/><text class="t c" x="85.0" y="1298">11 Learn</text><text class="s c" x="85.0" y="1316">L, M periodic</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="1252" x2="85.0" y2="1264"/>
