<g class="neutral">
<rect x="120" y="960" width="270" height="43" rx="6"/>
<text class="s" x="129" y="974">Runs what it recommends, or nothing,</text>
<text class="s" x="129" y="989">without stopping; says what ran and why</text>
</g>
<g class="approval">
<rect x="415" y="960" width="270" height="43" rx="6"/>
<text class="s" x="424" y="974">Stops with the recommendation:</text>
<text class="s" x="424" y="989">you pick the reviews</text>
</g>
<g class="approval">
<rect x="710" y="960" width="270" height="43" rx="6"/>
<text class="s" x="719" y="974">Stops with the recommendation: you</text>
<text class="s" x="719" y="989">pick (autopilot takes it, and logs it)</text>
</g>
