<text class="s" x="752" y="1154">deploy or DB migration; smoke</text>
<text class="s" x="752" y="1170">test passes</text>
</g>
<g class="stage"><rect x="30" y="1200" width="110" height="52" rx="8"/><text class="t c" x="85.0" y="1218">10 Operate</text><text class="s c" x="85.0" y="1236">L</text></g>
<line class="a" marker-end="url(#arrow)" x1="85.0" y1="1188" x2="85.0" y2="1200"/>
