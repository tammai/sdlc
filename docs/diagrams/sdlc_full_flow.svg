<g class="neutral">
<rect x="120" y="1395" width="860" height="66" rx="6"/>
<text class="s" x="132" y="1411">Parts (backlog.md, M or L bigger than one session): each part runs Build → verify.py → one commit, in a fresh session or autopilot.</text>
<text class="s" x="132" y="1428">All parts land together: one Review over the whole branch, then one Ship. Any code change after Build's gate goes back to Build.</text>
<text class="s" x="132" y="1445">/sdlc:deploy is on request, not a phase: the project's own deploy path, your go-ahead before production or a DB migration, smoke test.</text>
</g>
