<text class="s" x="380" y="1058">/sdlc:code-review</text>
</g>
<g class="hook"><rect x="574" y="1024" width="160" height="84" rx="6"/>
<text class="s" x="584" y="1042">security: review on</text>
<text class="s" x="584" y="1058">commit and push</text>
<text class="s" x="584" y="1074">hookify: no force-push</text>
