<svg width="100%" viewBox="0 0 680 1060" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SDLC orchestrator decision tree</title>
<desc>/sdlc:start resumes an active feature in its phase or starts a new one (offering /sdlc:setup if the repo isn't set up), sizes the work into the smallest fitting S, M or L track, then loops through the four phases Define, Build, Prove and Ship (with Learn): run the phase, check its gate, stop for the user at hard stops (Define's one approval of intent, spec and plan, not on S; anything that adds scope; Ship's merge, PR or keep on the full flow and L (S and lite commit on a branch and report it); push or merge; production deploy; DB migration), repeat until no phases remain. Three failed verify rounds in Prove, or the same requirement failing in two, go to the user. Deploy runs only when asked, with /sdlc:deploy.</desc>
<style>
text{font-family:anthropic-sans,-apple-system,"system-ui","Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central}
.a{fill:none;stroke:#898781;stroke-width:1.5}
.t{font-size:14px;font-weight:500}
.s{font-size:12px}
.l{font-size:12px;fill:#52514e}
.l[text-anchor=start]{text-anchor:start}
.neutral rect{fill:#fcfcfb;stroke:rgba(11,11,11,.2);stroke-width:.5}
.neutral .t{fill:#0b0b0b}.neutral .s{fill:#52514e}
.decision rect{fill:#eeedfe;stroke:#534ab7;stroke-width:.5}
.decision .t{fill:#3c3489}.decision .s{fill:#534ab7}
.action rect{fill:#e1f5ee;stroke:#0f6e56;stroke-width:.5}
.action .t{fill:#085041}.action .s{fill:#0f6e56}
.approval rect{fill:#faece7;stroke:#993c1d;stroke-width:.5}
.approval .t{fill:#712b13}.approval .s{fill:#993c1d}
@media (prefers-color-scheme:dark){
.a{stroke:#a09e96}.l{fill:#aaa8a2}
.neutral rect{fill:#262624;stroke:rgba(255,255,255,.2)}.neutral .t{fill:#f0efea}.neutral .s{fill:#aaa8a2}
.decision rect{fill:#26244a;stroke:#a098f0}.decision .t{fill:#cecbfa}.decision .s{fill:#a098f0}
.action rect{fill:#0c3228;stroke:#5ac8a5}.action .t{fill:#aae6d4}.action .s{fill:#5ac8a5}
.approval rect{fill:#401e14;stroke:#e68c6e}.approval .t{fill:#f5c8b9}.approval .s{fill:#e68c6e}
}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="neutral"><rect x="230" y="24" width="220" height="56" rx="8"/>
<text class="t" x="340.0" y="43">/sdlc:start</text>
<text class="s" x="340.0" y="63">Request, or empty to resume</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="80" x2="340" y2="106"/>
<g class="decision"><rect x="230" y="106" width="220" height="56" rx="8"/>
<text class="t" x="340.0" y="125">Active feature?</text>
<text class="s" x="340.0" y="145">Several: ask which one</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="230" y1="134" x2="192" y2="134"/>
<text class="l" x="211" y="124" text-anchor="middle">yes</text>
<g class="action"><rect x="30" y="106" width="160" height="56" rx="8"/>
<text class="t" x="110.0" y="125">Resume</text>
<text class="s" x="110.0" y="145">Continue in its phase</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M30 134 L12 134 L12 596 L218 596"/>
<line class="a" marker-end="url(#arrow)" x1="340" y1="162" x2="340" y2="190"/>
<text class="l" x="352" y="181" text-anchor="start">none</text>
<g class="action"><rect x="220" y="190" width="240" height="66" rx="8"/>
<text class="t" x="340.0" y="205">New feature setup</text>
<text class="s" x="340.0" y="225">Setup check (offer /sdlc:setup),</text>
<text class="s" x="340.0" y="243">commands, ticket, feature name</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="256" x2="340" y2="284"/>
<g class="decision"><rect x="190" y="284" width="300" height="86" rx="8"/>
<text class="t" x="340.0" y="300">Size the work</text>
<text class="s" x="340.0" y="320">Smallest track whose signals fit</text>
<text class="s" x="340.0" y="338">Size up only for a named signal</text>
<text class="s" x="340.0" y="356">Auth, payments, PII, migrations: at least M</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M290 370 L290 385 L125 385 L125 400"/>
<line class="a" marker-end="url(#arrow)" x1="340" y1="370" x2="340" y2="400"/>
<path class="a" marker-end="url(#arrow)" d="M390 370 L390 385 L555 385 L555 400"/>
<g class="action"><rect x="30" y="400" width="190" height="74" rx="8"/>
<text class="t" x="125.0" y="419">S · fix</text>
<text class="s" x="125.0" y="439">Intent, Repro in state</text>
<text class="s" x="125.0" y="457">No approval · repro test</text>
</g>
<g class="action"><rect x="245" y="400" width="190" height="74" rx="8"/>
<text class="t" x="340.0" y="419">M · feature</text>
<text class="s" x="340.0" y="439">All four phases</text>
<text class="s" x="340.0" y="457">Flow lite (default) or full</text>
</g>
<g class="action"><rect x="460" y="400" width="190" height="74" rx="8"/>
<text class="t" x="555.0" y="419">L · project</text>
<text class="s" x="555.0" y="439">All four phases</text>
<text class="s" x="555.0" y="457">Brainstorm, design · full security</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M125 474 L125 490 L300 490 L300 504"/>
<line class="a" marker-end="url(#arrow)" x1="340" y1="474" x2="340" y2="504"/>
<path class="a" marker-end="url(#arrow)" d="M555 474 L555 490 L380 490 L380 504"/>
<g class="action"><rect x="220" y="504" width="240" height="44" rx="8"/>
<text class="t" x="340.0" y="517">Write the state file</text>
<text class="s" x="340.0" y="537">Track, risk, Build method, phase</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="548" x2="340" y2="578"/>
<g class="action"><rect x="220" y="578" width="240" height="62" rx="8"/>
<text class="t" x="340.0" y="600">Run phase</text>
<text class="s" x="340.0" y="620">Define, Build, Prove, Ship + Learn</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="640" x2="340" y2="680"/>
<g class="decision"><rect x="240" y="680" width="200" height="44" rx="8"/>
<text class="t" x="340.0" y="702">Gate passes?</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="240" y1="702" x2="202" y2="702"/>
<text class="l" x="221" y="692" text-anchor="middle">no</text>
<g class="action"><rect x="30" y="667" width="170" height="70" rx="8"/>
<text class="t" x="115.0" y="684">Fix or step back</text>
<text class="s" x="115.0" y="704">Log why via state.py</text>
<text class="s" x="115.0" y="722">Prove: fix all, re-verify</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M115 667 L115 626 L218 626"/>
<line class="a" marker-end="url(#arrow)" x1="115" y1="737" x2="115" y2="770"/>
<g class="approval"><rect x="30" y="770" width="160" height="70" rx="8"/>
<text class="t" x="110.0" y="787">Ask you</text>
<text class="s" x="110.0" y="807">Round 3 or a repeat fail</text>
<text class="s" x="110.0" y="825">You pick the next move</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="724" x2="340" y2="770"/>
<text class="l" x="352" y="751" text-anchor="start">yes</text>
<g class="decision"><rect x="205" y="770" width="270" height="70" rx="8"/>
<text class="t" x="340.0" y="787">Hard stop?</text>
<text class="s" x="340.0" y="807">Define approval (not S) · added scope</text>
<text class="s" x="340.0" y="825">Merge, production deploy, DB migration</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="475" y1="805" x2="498" y2="805"/>
<text class="l" x="487" y="795" text-anchor="middle">yes</text>
<g class="approval"><rect x="500" y="770" width="150" height="70" rx="8"/>
<text class="t" x="575.0" y="796">Ask you</text>
<text class="s" x="575.0" y="816">Wait for approval</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M575 840 L575 856 L380 856 L380 870"/>
<line class="a" marker-end="url(#arrow)" x1="340" y1="840" x2="340" y2="870"/>
<text class="l" x="352" y="860" text-anchor="start">no</text>
<g class="decision"><rect x="240" y="870" width="200" height="44" rx="8"/>
<text class="t" x="340.0" y="892">More phases?</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M440 892 L665 892 L665 609 L462 609"/>
<text class="l" x="552" y="882" text-anchor="middle">yes · next phase</text>
<line class="a" marker-end="url(#arrow)" x1="340" y1="914" x2="340" y2="944"/>
<text class="l" x="352" y="934" text-anchor="start">no</text>
<g class="neutral"><rect x="220" y="944" width="240" height="56" rx="8"/>
<text class="t" x="340.0" y="963">Done</text>
<text class="s" x="340.0" y="983">Status: done · /sdlc:deploy on ask</text>
</g>
<g class="decision"><rect x="150" y="1030" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="170" y="1037">Decision</text>
<g class="action"><rect x="270" y="1030" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="290" y="1037">Action</text>
<g class="approval"><rect x="380" y="1030" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="400" y="1037">Your approval</text>
</svg>
