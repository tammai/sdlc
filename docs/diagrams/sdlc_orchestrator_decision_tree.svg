<svg width="100%" viewBox="0 0 680 1040" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SDLC orchestrator decision tree</title>
<desc>/sdlc:start resumes an active 2.0 feature (Process: 2) in its phase (a feature started under 1.x is refused: finish it on sdlc 1.8.1 or archive it). With none active it sizes the request: a trivial change is done directly with no workflow (change, test, commit); otherwise it starts a new feature (offering /sdlc:setup if the repo isn't set up) on the smallest fitting S, M or L track, writes the state file, then loops through the four phases Define, Build, Review and Ship (with Learn): run the phase, check its gate, stop for the user at hard stops (on high-risk M and on L, approving the change file and plan before the build and choosing the reviews after it; anything that adds scope; a reviewer and the builder disagreeing on a high finding; CI still red after one fix; merge; production deploy; DB migration; anything irreversible), repeat until no phases remain. S and low-risk M run straight through, running the reviews that fire. Review's high findings go back to Build. Ship stops with the PR open. Deploy runs only when asked, with /sdlc:deploy.</desc>
<style>
text{font-family:anthropic-sans,-apple-system,"system-ui","Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central}
.a{fill:none;stroke:#898781;stroke-width:1.5}
.t{font-size:14px;font-weight:500}
.s{font-size:12px}
.l{font-size:12px;fill:#52514e}
.l[text-anchor=start]{text-anchor:start}
.neutral rect{fill:#fcfcfb;stroke:rgba(11,11,11,.2);stroke-width:.5}
.neutral .t{fill:#0b0b0b}.neutral .s{fill:#52514e}
.decision rect{fill:#eeedfe;stroke:#534ab7;stroke-width:.5}
.decision .t{fill:#3c3489}.decision .s{fill:#534ab7}
.action rect{fill:#e1f5ee;stroke:#0f6e56;stroke-width:.5}
.action .t{fill:#085041}.action .s{fill:#0f6e56}
.approval rect{fill:#faece7;stroke:#993c1d;stroke-width:.5}
.approval .t{fill:#712b13}.approval .s{fill:#993c1d}
@media (prefers-color-scheme:dark){
.a{stroke:#a09e96}.l{fill:#aaa8a2}
.neutral rect{fill:#262624;stroke:rgba(255,255,255,.2)}.neutral .t{fill:#f0efea}.neutral .s{fill:#aaa8a2}
.decision rect{fill:#26244a;stroke:#a098f0}.decision .t{fill:#cecbfa}.decision .s{fill:#a098f0}
.action rect{fill:#0c3228;stroke:#5ac8a5}.action .t{fill:#aae6d4}.action .s{fill:#5ac8a5}
.approval rect{fill:#401e14;stroke:#e68c6e}.approval .t{fill:#f5c8b9}.approval .s{fill:#e68c6e}
}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="neutral"><rect x="230" y="24" width="220" height="56" rx="8"/>
<text class="t" x="340.0" y="43">/sdlc:start</text>
<text class="s" x="340.0" y="63">Request, or empty to resume</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="80" x2="340" y2="106"/>
<g class="decision"><rect x="250" y="106" width="180" height="56" rx="8"/>
<text class="t" x="340.0" y="125">Active state file?</text>
<text class="s" x="340.0" y="145">Several: ask which one</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="250" y1="134" x2="172" y2="134"/>
<text class="l" x="211" y="124" text-anchor="middle">Process: 2</text>
<g class="action"><rect x="30" y="106" width="140" height="56" rx="8"/>
<text class="t" x="100.0" y="125">Resume</text>
<text class="s" x="100.0" y="145">Continue in its phase</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M30 134 L12 134 L12 537 L208 537"/>
<line class="a" marker-end="url(#arrow)" x1="430" y1="134" x2="508" y2="134"/>
<text class="l" x="469" y="124" text-anchor="middle">without it</text>
<g class="approval"><rect x="510" y="97" width="150" height="74" rx="8"/>
<text class="t" x="585.0" y="116">1.x feature</text>
<text class="s" x="585.0" y="136">Finish on sdlc 1.8.1</text>
<text class="s" x="585.0" y="154">or archive it</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="162" x2="340" y2="190"/>
<text class="l" x="352" y="176" text-anchor="start">none</text>
<g class="decision"><rect x="170" y="190" width="340" height="86" rx="8"/>
<text class="t" x="340.0" y="206">Size the request</text>
<text class="s" x="340.0" y="226">Smallest track whose signals fit</text>
<text class="s" x="340.0" y="244">Size up only for a named signal</text>
<text class="s" x="340.0" y="262">Risk (auth, PII, migrations) shapes the reviews</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M230 276 L230 291 L97 291 L97 306"/>
<path class="a" marker-end="url(#arrow)" d="M300 276 L300 291 L260 291 L260 306"/>
<path class="a" marker-end="url(#arrow)" d="M380 276 L380 291 L424 291 L424 306"/>
<path class="a" marker-end="url(#arrow)" d="M450 276 L450 291 L587 291 L587 306"/>
<g class="neutral"><rect x="24" y="306" width="146" height="74" rx="8"/>
<text class="t" x="97.0" y="325">Trivial</text>
<text class="s" x="97.0" y="345">No record, no state</text>
<text class="s" x="97.0" y="363">Change, test, commit</text>
</g>
<g class="action"><rect x="187" y="306" width="146" height="74" rx="8"/>
<text class="t" x="260.0" y="325">S · fix</text>
<text class="s" x="260.0" y="345">A few lines each</text>
<text class="s" x="260.0" y="363">No approval stop</text>
</g>
<g class="action"><rect x="351" y="306" width="146" height="74" rx="8"/>
<text class="t" x="424.0" y="325">M · feature</text>
<text class="s" x="424.0" y="345">Intent, spec, plan</text>
<text class="s" x="424.0" y="363">You approve them</text>
</g>
<g class="action"><rect x="514" y="306" width="146" height="74" rx="8"/>
<text class="t" x="587.0" y="325">L · project</text>
<text class="s" x="587.0" y="345">Brainstorm interview</text>
<text class="s" x="587.0" y="363">You approve them</text>
</g>
<path class="a" d="M260 380 L260 395 L587 395 L587 380 M424 380 L424 395"/>
<line class="a" marker-end="url(#arrow)" x1="340" y1="395" x2="340" y2="410"/>
<g class="action"><rect x="200" y="410" width="280" height="74" rx="8"/>
<text class="t" x="340.0" y="429">Start the feature</text>
<text class="s" x="340.0" y="449">Setup check (offer /sdlc:setup)</text>
<text class="s" x="340.0" y="467">Ticket, name, state file (Process: 2)</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="484" x2="340" y2="512"/>
<g class="action"><rect x="210" y="512" width="260" height="74" rx="8"/>
<text class="t" x="340.0" y="531">Run phase</text>
<text class="s" x="340.0" y="551">Define 1 → Build 4 → Review 5 → Ship 8</text>
<text class="s" x="340.0" y="569">Reviews recommended; S runs them</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="340" y1="586" x2="340" y2="614"/>
<g class="decision"><rect x="240" y="614" width="200" height="44" rx="8"/>
<text class="t" x="340.0" y="636">Gate passes?</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="240" y1="636" x2="202" y2="636"/>
<text class="l" x="221" y="626" text-anchor="middle">no</text>
<g class="action"><rect x="30" y="601" width="170" height="70" rx="8"/>
<text class="t" x="115.0" y="618">Fix, then rerun</text>
<text class="s" x="115.0" y="638">Review highs go to Build</text>
<text class="s" x="115.0" y="656">Each fixed test-first</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M115 601 L115 567 L208 567"/>
<line class="a" marker-end="url(#arrow)" x1="340" y1="658" x2="340" y2="690"/>
<text class="l" x="352" y="674" text-anchor="start">yes</text>
<g class="decision"><rect x="165" y="690" width="330" height="108" rx="8"/>
<text class="t" x="330.0" y="708">Hard stop?</text>
<text class="s" x="330.0" y="728">M, L: approve before build, pick reviews after</text>
<text class="s" x="330.0" y="746">Added scope · CI red after one fix</text>
<text class="s" x="330.0" y="764">Reviewer and builder disagree on a high</text>
<text class="s" x="330.0" y="782">Merge, deploy, migration, anything irreversible</text>
</g>
<line class="a" marker-end="url(#arrow)" x1="495" y1="744" x2="526" y2="744"/>
<text class="l" x="511" y="734" text-anchor="middle">yes</text>
<g class="approval"><rect x="528" y="709" width="132" height="70" rx="8"/>
<text class="t" x="594.0" y="734">Ask you</text>
<text class="s" x="594.0" y="754">Wait for your answer</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M594 779 L594 814 L380 814 L380 830"/>
<line class="a" marker-end="url(#arrow)" x1="340" y1="798" x2="340" y2="830"/>
<text class="l" x="352" y="812" text-anchor="start">no</text>
<g class="decision"><rect x="240" y="830" width="200" height="44" rx="8"/>
<text class="t" x="340.0" y="852">More phases?</text>
</g>
<path class="a" marker-end="url(#arrow)" d="M440 852 L670 852 L670 549 L472 549"/>
<text class="l" x="552" y="842" text-anchor="middle">yes · next phase</text>
<line class="a" marker-end="url(#arrow)" x1="340" y1="874" x2="340" y2="904"/>
<text class="l" x="352" y="889" text-anchor="start">no</text>
<g class="neutral"><rect x="200" y="904" width="280" height="74" rx="8"/>
<text class="t" x="340.0" y="923">Done</text>
<text class="s" x="340.0" y="943">PR open, local and CI green</text>
<text class="s" x="340.0" y="961">Merge on your word · /sdlc:deploy on ask</text>
</g>
<g class="decision"><rect x="150" y="1010" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="170" y="1017">Decision</text>
<g class="action"><rect x="270" y="1010" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="290" y="1017">Action</text>
<g class="approval"><rect x="380" y="1010" width="14" height="14" rx="3"/></g><text class="l" text-anchor="start" x="400" y="1017">Your approval</text>
</svg>
