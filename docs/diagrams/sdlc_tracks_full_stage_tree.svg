<svg width="100%" viewBox="0 0 680 660" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SDLC tracks with full stage lists</title>
<desc>Sizing picks the smallest fitting S, M or L track. Each track lists all 11 stages, marked as runs, light, optional or skipped. A dot marks stages that end by asking the user.</desc>
<style>
text{font-family:anthropic-sans,-apple-system,"system-ui","Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central}
.a{fill:none;stroke:#898781;stroke-width:1.5}
.t{font-size:14px;font-weight:500}.s{font-size:12px}.r{font-size:12px}
.l{font-size:12px;fill:#52514e}.l[text-anchor=start]{text-anchor:start}
rect{stroke-width:.5}
.neutral rect{fill:#fcfcfb;stroke:rgba(11,11,11,.2)}.neutral .t{fill:#0b0b0b}
.head rect{fill:#e1f5ee;stroke:#0f6e56}.head .t{fill:#085041}.head .s{fill:#0f6e56}
.run rect{fill:#eeedfe;stroke:#534ab7}.run .r{fill:#3c3489}
.light rect{fill:#eeedfe;stroke:#534ab7;stroke-dasharray:4 3}.light .r{fill:#3c3489}
.opt rect{fill:#f1efe8;stroke:#5f5e5a}.opt .r{fill:#444441}
.skip rect{fill:none;stroke:rgba(11,11,11,.2);stroke-dasharray:4 3}.skip .r{fill:#898781}
.dot{fill:#993c1d}
@media (prefers-color-scheme:dark){
.a{stroke:#a09e96}.l{fill:#aaa8a2}
.neutral rect{fill:#262624;stroke:rgba(255,255,255,.2)}.neutral .t{fill:#f0efea}
.head rect{fill:#0c3228;stroke:#5ac8a5}.head .t{fill:#aae6d4}.head .s{fill:#5ac8a5}
.run rect,.light rect{fill:#26244a;stroke:#a098f0}.run .r,.light .r{fill:#cecbfa}
.opt rect{fill:#2e2d2a;stroke:#a09e96}.opt .r{fill:#d3d1c7}
.skip rect{stroke:rgba(255,255,255,.2)}.skip .r{fill:#8a8881}
.dot{fill:#e68c6e}
}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="neutral"><rect x="240" y="24" width="200" height="44" rx="8"/><text class="t" x="340" y="46">Size the work</text></g>
<path class="a" marker-end="url(#arrow)" d="M340 68 L340 88 L130 88 L130 108"/>
<line class="a" marker-end="url(#arrow)" x1="340" y1="68" x2="340" y2="108"/>
<path class="a" marker-end="url(#arrow)" d="M340 88 L550 88 L550 108"/>
<g class="head"><rect x="40" y="110" width="180" height="56" rx="8"/><text class="t" x="130.0" y="128">S · fix</text><text class="s" x="130.0" y="148">Bug or tweak, 1–3 files</text></g>
<line class="a" marker-end="url(#arrow)" x1="130.0" y1="166" x2="130.0" y2="184"/>
<g class="skip"><rect x="40" y="186" width="180" height="30" rx="4"/><text class="r" x="130.0" y="201">1 Discover</text>
</g>
<g class="skip"><rect x="40" y="224" width="180" height="30" rx="4"/><text class="r" x="130.0" y="239">2 Design</text>
</g>
<g class="skip"><rect x="40" y="262" width="180" height="30" rx="4"/><text class="r" x="130.0" y="277">3 Plan</text>
</g>
<g class="run"><rect x="40" y="300" width="180" height="30" rx="4"/><text class="r" x="130.0" y="315">4 Implement · repro test</text>
</g>
<g class="run"><rect x="40" y="338" width="180" height="30" rx="4"/><text class="r" x="130.0" y="353">5 Verify</text>
</g>
<g class="light"><rect x="40" y="376" width="180" height="30" rx="4"/><text class="r" x="130.0" y="391">6 Review · light</text>
</g>
<g class="skip"><rect x="40" y="414" width="180" height="30" rx="4"/><text class="r" x="130.0" y="429">7 Security · hooks only</text>
</g>
<g class="run"><rect x="40" y="452" width="180" height="30" rx="4"/><text class="r" x="130.0" y="467">8 PR / CI</text>
<circle class="dot" cx="210" cy="467" r="3.5"/>
</g>
<g class="opt"><rect x="40" y="490" width="180" height="30" rx="4"/><text class="r" x="130.0" y="505">9 Deploy · on ask</text>
<circle class="dot" cx="210" cy="505" r="3.5"/>
</g>
<g class="skip"><rect x="40" y="528" width="180" height="30" rx="4"/><text class="r" x="130.0" y="543">10 Operate</text>
</g>
<g class="skip"><rect x="40" y="566" width="180" height="30" rx="4"/><text class="r" x="130.0" y="581">11 Learn</text>
</g>
<g class="head"><rect x="250" y="110" width="180" height="56" rx="8"/><text class="t" x="340.0" y="128">M · feature</text><text class="s" x="340.0" y="148">Few days, clear approach</text></g>
<line class="a" marker-end="url(#arrow)" x1="340.0" y1="166" x2="340.0" y2="184"/>
<g class="run"><rect x="250" y="186" width="180" height="30" rx="4"/><text class="r" x="340.0" y="201">1 Discover · spec</text>
<circle class="dot" cx="420" cy="201" r="3.5"/>
</g>
<g class="opt"><rect x="250" y="224" width="180" height="30" rx="4"/><text class="r" x="340.0" y="239">2 Design · if unclear</text>
<circle class="dot" cx="420" cy="239" r="3.5"/>
</g>
<g class="run"><rect x="250" y="262" width="180" height="30" rx="4"/><text class="r" x="340.0" y="277">3 Plan</text>
<circle class="dot" cx="420" cy="277" r="3.5"/>
</g>
<g class="run"><rect x="250" y="300" width="180" height="30" rx="4"/><text class="r" x="340.0" y="315">4 Implement</text>
</g>
<g class="run"><rect x="250" y="338" width="180" height="30" rx="4"/><text class="r" x="340.0" y="353">5 Verify</text>
</g>
<g class="run"><rect x="250" y="376" width="180" height="30" rx="4"/><text class="r" x="340.0" y="391">6 Review</text>
</g>
<g class="light"><rect x="250" y="414" width="180" height="30" rx="4"/><text class="r" x="340.0" y="429">7 Security · light</text>
</g>
<g class="run"><rect x="250" y="452" width="180" height="30" rx="4"/><text class="r" x="340.0" y="467">8 PR / CI</text>
<circle class="dot" cx="420" cy="467" r="3.5"/>
</g>
<g class="opt"><rect x="250" y="490" width="180" height="30" rx="4"/><text class="r" x="340.0" y="505">9 Deploy · on ask</text>
<circle class="dot" cx="420" cy="505" r="3.5"/>
</g>
<g class="skip"><rect x="250" y="528" width="180" height="30" rx="4"/><text class="r" x="340.0" y="543">10 Operate</text>
</g>
<g class="opt"><rect x="250" y="566" width="180" height="30" rx="4"/><text class="r" x="340.0" y="581">11 Learn · periodic</text>
</g>
<g class="head"><rect x="460" y="110" width="180" height="56" rx="8"/><text class="t" x="550.0" y="128">L · project</text><text class="s" x="550.0" y="148">Unclear or risky area</text></g>
<line class="a" marker-end="url(#arrow)" x1="550.0" y1="166" x2="550.0" y2="184"/>
<g class="run"><rect x="460" y="186" width="180" height="30" rx="4"/><text class="r" x="550.0" y="201">1 Discover · brainstorm</text>
<circle class="dot" cx="630" cy="201" r="3.5"/>
</g>
<g class="run"><rect x="460" y="224" width="180" height="30" rx="4"/><text class="r" x="550.0" y="239">2 Design</text>
<circle class="dot" cx="630" cy="239" r="3.5"/>
</g>
<g class="run"><rect x="460" y="262" width="180" height="30" rx="4"/><text class="r" x="550.0" y="277">3 Plan · analyze</text>
<circle class="dot" cx="630" cy="277" r="3.5"/>
</g>
<g class="run"><rect x="460" y="300" width="180" height="30" rx="4"/><text class="r" x="550.0" y="315">4 Implement · worktree</text>
</g>
<g class="run"><rect x="460" y="338" width="180" height="30" rx="4"/><text class="r" x="550.0" y="353">5 Verify</text>
</g>
<g class="run"><rect x="460" y="376" width="180" height="30" rx="4"/><text class="r" x="550.0" y="391">6 Review</text>
</g>
<g class="run"><rect x="460" y="414" width="180" height="30" rx="4"/><text class="r" x="550.0" y="429">7 Security · full</text>
</g>
<g class="run"><rect x="460" y="452" width="180" height="30" rx="4"/><text class="r" x="550.0" y="467">8 PR / CI</text>
<circle class="dot" cx="630" cy="467" r="3.5"/>
</g>
<g class="opt"><rect x="460" y="490" width="180" height="30" rx="4"/><text class="r" x="550.0" y="505">9 Deploy · on ask</text>
<circle class="dot" cx="630" cy="505" r="3.5"/>
</g>
<g class="skip"><rect x="460" y="528" width="180" height="30" rx="4"/><text class="r" x="550.0" y="543">10 Operate</text>
</g>
<g class="run"><rect x="460" y="566" width="180" height="30" rx="4"/><text class="r" x="550.0" y="581">11 Learn</text>
</g>
<g class="run"><rect x="40" y="626" width="14" height="14" rx="3"/></g>
<text class="l" text-anchor="start" x="60" y="633">Runs</text>
<g class="light"><rect x="130" y="626" width="14" height="14" rx="3"/></g>
<text class="l" text-anchor="start" x="150" y="633">Light version</text>
<g class="opt"><rect x="270" y="626" width="14" height="14" rx="3"/></g>
<text class="l" text-anchor="start" x="290" y="633">Optional</text>
<g class="skip"><rect x="370" y="626" width="14" height="14" rx="3"/></g>
<text class="l" text-anchor="start" x="390" y="633">Skipped</text>
<circle class="dot" cx="477" cy="633" r="4"/>
<text class="l" text-anchor="start" x="490" y="633">Asks you at the end</text>
</svg>
