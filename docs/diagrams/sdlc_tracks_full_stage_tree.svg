<svg width="100%" viewBox="0 0 680 572" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SDLC tracks and their phases</title>
<desc>Sizing picks the smallest fitting S, M or L track. Each track runs the four phases Define, Build, Review and Ship with Learn, and writes the same record: intent.md, spec.md (each acceptance criterion with its test) and plan.md, then review.md; S fills each in a few lines. Every track's Build records each acceptance criterion's test failing before its code and ends with one passing verify.py run, which Review reuses. After the build the agent recommends reviews (security, code at default or high depth, UI, the advisor, or none), each run once on opus. A dot marks phases that stop for the user: Define and Review on M and L. S has no stop. Ship stops with the PR open on every track; merge waits for the user. Work too big for one session loops Build and a commit per part, then one Review and one Ship at feature close. Deploy is the on-request command /sdlc:deploy on any track, not a phase.</desc>
<style>
text{font-family:anthropic-sans,-apple-system,"system-ui","Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central}
.a{fill:none;stroke:#898781;stroke-width:1.5}
.t{font-size:14px;font-weight:500}.s{font-size:12px}.r{font-size:12px}
.l{font-size:12px;fill:#52514e}.l[text-anchor=start]{text-anchor:start}
rect{stroke-width:.5}
.neutral rect{fill:#fcfcfb;stroke:rgba(11,11,11,.2)}.neutral .t{fill:#0b0b0b}
.head rect{fill:#e1f5ee;stroke:#0f6e56}.head .t{fill:#085041}.head .s{fill:#0f6e56}
.run rect{fill:#eeedfe;stroke:#534ab7}.run .r{fill:#3c3489}
.light rect{fill:#eeedfe;stroke:#534ab7;stroke-dasharray:4 3}.light .r{fill:#3c3489}
.opt rect{fill:#f1efe8;stroke:#5f5e5a}.opt .r{fill:#444441}
.skip rect{fill:none;stroke:rgba(11,11,11,.2);stroke-dasharray:4 3}.skip .r{fill:#898781}
.dot{fill:#993c1d}
@media (prefers-color-scheme:dark){
.a{stroke:#a09e96}.l{fill:#aaa8a2}
.neutral rect{fill:#262624;stroke:rgba(255,255,255,.2)}.neutral .t{fill:#f0efea}
.head rect{fill:#0c3228;stroke:#5ac8a5}.head .t{fill:#aae6d4}.head .s{fill:#5ac8a5}
.run rect,.light rect{fill:#26244a;stroke:#a098f0}.run .r,.light .r{fill:#cecbfa}
.opt rect{fill:#2e2d2a;stroke:#a09e96}.opt .r{fill:#d3d1c7}
.skip rect{stroke:rgba(255,255,255,.2)}.skip .r{fill:#8a8881}
.dot{fill:#e68c6e}
}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="neutral"><rect x="240" y="24" width="200" height="44" rx="8"/><text class="t" x="340" y="46">Size the work</text></g>
<line class="a" marker-end="url(#arrow)" x1="440" y1="46" x2="476" y2="46"/>
<g class="head"><rect x="478" y="24" width="162" height="44" rx="8"/><text class="t" x="559" y="37">Trivial</text><text class="s" x="559" y="56">change, test, commit</text></g>
<path class="a" marker-end="url(#arrow)" d="M340 68 L340 88 L130 88 L130 108"/>
<line class="a" marker-end="url(#arrow)" x1="340" y1="68" x2="340" y2="108"/>
<path class="a" marker-end="url(#arrow)" d="M340 88 L550 88 L550 108"/>
<g class="head"><rect x="40" y="110" width="180" height="56" rx="8"/><text class="t" x="130.0" y="128">S · fix</text><text class="s" x="130.0" y="148">Fix or tweak, 1–2 files</text></g>
<line class="a" marker-end="url(#arrow)" x1="130.0" y1="166" x2="130.0" y2="184"/>
<g class="light"><rect x="40" y="186" width="180" height="58" rx="4"/>
<text class="r" x="130.0" y="200" font-weight="600">Define</text>
<text class="r" x="130.0" y="217">3 files, a few lines each</text>
<text class="r" x="130.0" y="232">asks if unclear; no stop</text>
</g>
<g class="run"><rect x="40" y="252" width="180" height="58" rx="4"/>
<text class="r" x="130.0" y="266" font-weight="600">Build</text>
<text class="r" x="130.0" y="283">each AC's test red first,</text>
<text class="r" x="130.0" y="298">inline, then verify.py</text>
</g>
<g class="light"><rect x="40" y="318" width="180" height="58" rx="4"/>
<text class="r" x="130.0" y="332" font-weight="600">Review</text>
<text class="r" x="130.0" y="349">runs what it recommends,</text>
<text class="r" x="130.0" y="364">or none; no stop</text>
</g>
<g class="run"><rect x="40" y="384" width="180" height="58" rx="4"/>
<text class="r" x="130.0" y="398" font-weight="600">Ship · Learn</text>
<text class="r" x="130.0" y="415">learn, commit, PR, CI;</text>
<text class="r" x="130.0" y="430">merge on your word</text>
<circle class="dot" cx="210" cy="398" r="3.5"/>
</g>
<g class="head"><rect x="250" y="110" width="180" height="56" rx="8"/><text class="t" x="340.0" y="128">M · feature</text><text class="s" x="340.0" y="148">Approach mostly clear</text></g>
<line class="a" marker-end="url(#arrow)" x1="340.0" y1="166" x2="340.0" y2="184"/>
<g class="run"><rect x="250" y="186" width="180" height="58" rx="4"/>
<text class="r" x="340.0" y="200" font-weight="600">Define</text>
<text class="r" x="340.0" y="217">intent, spec, plan in full</text>
<text class="r" x="340.0" y="232">one question at a time</text>
<circle class="dot" cx="420" cy="200" r="3.5"/>
</g>
<g class="run"><rect x="250" y="252" width="180" height="58" rx="4"/>
<text class="r" x="340.0" y="266" font-weight="600">Build</text>
<text class="r" x="340.0" y="283">inline, each AC red first</text>
<text class="r" x="340.0" y="298">one verify.py at the end</text>
</g>
<g class="run"><rect x="250" y="318" width="180" height="58" rx="4"/>
<text class="r" x="340.0" y="332" font-weight="600">Review</text>
<text class="r" x="340.0" y="349">agent recommends, you</text>
<text class="r" x="340.0" y="364">pick; each once, on opus</text>
<circle class="dot" cx="420" cy="332" r="3.5"/>
</g>
<g class="run"><rect x="250" y="384" width="180" height="58" rx="4"/>
<text class="r" x="340.0" y="398" font-weight="600">Ship · Learn</text>
<text class="r" x="340.0" y="415">learn, commit, PR, CI;</text>
<text class="r" x="340.0" y="430">merge on your word</text>
<circle class="dot" cx="420" cy="398" r="3.5"/>
</g>
<g class="head"><rect x="460" y="110" width="180" height="56" rx="8"/><text class="t" x="550.0" y="128">L · project</text><text class="s" x="550.0" y="148">Several parts or unclear</text></g>
<line class="a" marker-end="url(#arrow)" x1="550.0" y1="166" x2="550.0" y2="184"/>
<g class="run"><rect x="460" y="186" width="180" height="58" rx="4"/>
<text class="r" x="550.0" y="200" font-weight="600">Define</text>
<text class="r" x="550.0" y="217">brainstorming interview</text>
<text class="r" x="550.0" y="232">+ backlog.md if too big</text>
<circle class="dot" cx="630" cy="200" r="3.5"/>
</g>
<g class="run"><rect x="460" y="252" width="180" height="58" rx="4"/>
<text class="r" x="550.0" y="266" font-weight="600">Build</text>
<text class="r" x="550.0" y="283">inline, parts in fresh</text>
<text class="r" x="550.0" y="298">sessions, or subagents</text>
</g>
<g class="run"><rect x="460" y="318" width="180" height="58" rx="4"/>
<text class="r" x="550.0" y="332" font-weight="600">Review</text>
<text class="r" x="550.0" y="349">one, after the last part;</text>
<text class="r" x="550.0" y="364">you pick from the advice</text>
<circle class="dot" cx="630" cy="332" r="3.5"/>
</g>
<g class="run"><rect x="460" y="384" width="180" height="58" rx="4"/>
<text class="r" x="550.0" y="398" font-weight="600">Ship · Learn</text>
<text class="r" x="550.0" y="415">one Ship for all parts;</text>
<text class="r" x="550.0" y="430">merge on your word</text>
<circle class="dot" cx="630" cy="398" r="3.5"/>
</g>
<g class="opt"><rect x="40" y="456" width="600" height="34" rx="4"/><text class="r" x="340" y="473">/sdlc:deploy · on request, any track · not a phase</text>
<circle class="dot" cx="630" cy="473" r="3.5"/>
</g>
<text class="l" x="340" y="510">Parts: each loops Build → commit; after the last part, one Review, then one Ship</text>
<g class="run"><rect x="40" y="538" width="14" height="14" rx="3"/></g>
<text class="l" text-anchor="start" x="60" y="545">Runs</text>
<g class="light"><rect x="130" y="538" width="14" height="14" rx="3"/></g>
<text class="l" text-anchor="start" x="150" y="545">Light version, no stop</text>
<g class="opt"><rect x="320" y="538" width="14" height="14" rx="3"/></g>
<text class="l" text-anchor="start" x="340" y="545">On request</text>
<circle class="dot" cx="447" cy="545" r="4"/>
<text class="l" text-anchor="start" x="460" y="545">Stops for you</text>
</svg>
