<svg width="100%" viewBox="0 0 680 572" role="img" xmlns="http://www.w3.org/2000/svg">
<title>SDLC tracks and their phases</title>
<desc>Sizing picks the smallest fitting S, M or L track. Each track runs the four phases Define, Build, Prove and Ship with Learn; every track writes intent.md, spec.md and plan.md; S's are short, with no approval, and S dispatches no Prove checkers (the session runs the full suite once); M runs Flow lite by default, where Prove is one fresh verifier (full on high risk adds a light code review); L adds brainstorming and design in Define and full security in Prove. A dot marks phases that end by asking the user. Backlog slices loop Build, Prove and a commit, then a feature close. Deploy is the on-request command /sdlc:deploy on any track, not a phase.</desc>
<style>
text{font-family:anthropic-sans,-apple-system,"system-ui","Segoe UI",sans-serif;text-anchor:middle;dominant-baseline:central}
.a{fill:none;stroke:#898781;stroke-width:1.5}
.t{font-size:14px;font-weight:500}.s{font-size:12px}.r{font-size:12px}
.l{font-size:12px;fill:#52514e}.l[text-anchor=start]{text-anchor:start}
rect{stroke-width:.5}
.neutral rect{fill:#fcfcfb;stroke:rgba(11,11,11,.2)}.neutral .t{fill:#0b0b0b}
.head rect{fill:#e1f5ee;stroke:#0f6e56}.head .t{fill:#085041}.head .s{fill:#0f6e56}
.run rect{fill:#eeedfe;stroke:#534ab7}.run .r{fill:#3c3489}
.light rect{fill:#eeedfe;stroke:#534ab7;stroke-dasharray:4 3}.light .r{fill:#3c3489}
.opt rect{fill:#f1efe8;stroke:#5f5e5a}.opt .r{fill:#444441}
.skip rect{fill:none;stroke:rgba(11,11,11,.2);stroke-dasharray:4 3}.skip .r{fill:#898781}
.dot{fill:#993c1d}
@media (prefers-color-scheme:dark){
.a{stroke:#a09e96}.l{fill:#aaa8a2}
.neutral rect{fill:#262624;stroke:rgba(255,255,255,.2)}.neutral .t{fill:#f0efea}
.head rect{fill:#0c3228;stroke:#5ac8a5}.head .t{fill:#aae6d4}.head .s{fill:#5ac8a5}
.run rect,.light rect{fill:#26244a;stroke:#a098f0}.run .r,.light .r{fill:#cecbfa}
.opt rect{fill:#2e2d2a;stroke:#a09e96}.opt .r{fill:#d3d1c7}
.skip rect{stroke:rgba(255,255,255,.2)}.skip .r{fill:#8a8881}
.dot{fill:#e68c6e}
}</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<g class="neutral"><rect x="240" y="24" width="200" height="44" rx="8"/><text class="t" x="340" y="46">Size the work</text></g>
<path class="a" marker-end="url(#arrow)" d="M340 68 L340 88 L130 88 L130 108"/>
<line class="a" marker-end="url(#arrow)" x1="340" y1="68" x2="340" y2="108"/>
<path class="a" marker-end="url(#arrow)" d="M340 88 L550 88 L550 108"/>
<g class="head"><rect x="40" y="110" width="180" height="56" rx="8"/><text class="t" x="130.0" y="128">S · fix</text><text class="s" x="130.0" y="148">Bug or tweak, 1–3 files</text></g>
<line class="a" marker-end="url(#arrow)" x1="130.0" y1="166" x2="130.0" y2="184"/>
<g class="light"><rect x="40" y="186" width="180" height="58" rx="4"/>
<text class="r" x="130.0" y="200" font-weight="600">Define</text>
<text class="r" x="130.0" y="217">intent, spec, plan; no approval</text>
<text class="r" x="130.0" y="232">blocking questions only</text>
</g>
<g class="run"><rect x="40" y="252" width="180" height="58" rx="4"/>
<text class="r" x="130.0" y="266" font-weight="600">Build</text>
<text class="r" x="130.0" y="283">repro test first</text>
<text class="r" x="130.0" y="298">one implementer (sonnet)</text>
</g>
<g class="run"><rect x="40" y="318" width="180" height="58" rx="4"/>
<text class="r" x="130.0" y="332" font-weight="600">Prove</text>
<text class="r" x="130.0" y="349">no checkers: suite run once</text>
<text class="r" x="130.0" y="364">security: hooks only</text>
</g>
<g class="run"><rect x="40" y="384" width="180" height="58" rx="4"/>
<text class="r" x="130.0" y="398" font-weight="600">Ship · Learn</text>
<text class="r" x="130.0" y="415">one commit, then you pick</text>
<text class="r" x="130.0" y="430">merge, PR or keep</text>
<circle class="dot" cx="210" cy="398" r="3.5"/>
</g>
<g class="head"><rect x="250" y="110" width="180" height="56" rx="8"/><text class="t" x="340.0" y="128">M · feature</text><text class="s" x="340.0" y="148">Few days, clear approach</text></g>
<line class="a" marker-end="url(#arrow)" x1="340.0" y1="166" x2="340.0" y2="184"/>
<g class="run"><rect x="250" y="186" width="180" height="58" rx="4"/>
<text class="r" x="340.0" y="200" font-weight="600">Define</text>
<text class="r" x="340.0" y="217">intent, spec, plan</text>
<text class="r" x="340.0" y="232">design only if unclear</text>
<circle class="dot" cx="420" cy="200" r="3.5"/>
</g>
<g class="run"><rect x="250" y="252" width="180" height="58" rx="4"/>
<text class="r" x="340.0" y="266" font-weight="600">Build</text>
<text class="r" x="340.0" y="283">native, test first</text>
<text class="r" x="340.0" y="298">in this session</text>
</g>
<g class="run"><rect x="250" y="318" width="180" height="58" rx="4"/>
<text class="r" x="340.0" y="332" font-weight="600">Prove</text>
<text class="r" x="340.0" y="349">lite: one fresh verifier</text>
<text class="r" x="340.0" y="364">full: + light review</text>
</g>
<g class="run"><rect x="250" y="384" width="180" height="58" rx="4"/>
<text class="r" x="340.0" y="398" font-weight="600">Ship · Learn</text>
<text class="r" x="340.0" y="415">one commit, then you pick</text>
<text class="r" x="340.0" y="430">merge, PR or keep</text>
<circle class="dot" cx="420" cy="398" r="3.5"/>
</g>
<g class="head"><rect x="460" y="110" width="180" height="56" rx="8"/><text class="t" x="550.0" y="128">L · project</text><text class="s" x="550.0" y="148">Unclear or risky area</text></g>
<line class="a" marker-end="url(#arrow)" x1="550.0" y1="166" x2="550.0" y2="184"/>
<g class="run"><rect x="460" y="186" width="180" height="58" rx="4"/>
<text class="r" x="550.0" y="200" font-weight="600">Define</text>
<text class="r" x="550.0" y="217">brainstorm, design,</text>
<text class="r" x="550.0" y="232">consistency check</text>
<circle class="dot" cx="630" cy="200" r="3.5"/>
</g>
<g class="run"><rect x="460" y="252" width="180" height="58" rx="4"/>
<text class="r" x="550.0" y="266" font-weight="600">Build</text>
<text class="r" x="550.0" y="283">tasks: implementer and</text>
<text class="r" x="550.0" y="298">review per task · worktree</text>
</g>
<g class="run"><rect x="460" y="318" width="180" height="58" rx="4"/>
<text class="r" x="550.0" y="332" font-weight="600">Prove</text>
<text class="r" x="550.0" y="349">one round · top tier</text>
<text class="r" x="550.0" y="364">full security</text>
</g>
<g class="run"><rect x="460" y="384" width="180" height="58" rx="4"/>
<text class="r" x="550.0" y="398" font-weight="600">Ship · Learn</text>
<text class="r" x="550.0" y="415">+ retro.md, feature doc</text>
<text class="r" x="550.0" y="430">merge, PR or keep</text>
<circle class="dot" cx="630" cy="398" r="3.5"/>
</g>
<g class="opt"><rect x="40" y="456" width="600" height="34" rx="4"/><text class="r" x="340" y="473">/sdlc:deploy · on request, any track · not a phase</text>
<circle class="dot" cx="630" cy="473" r="3.5"/>
</g>
<text class="l" x="340" y="510">Backlog: each slice loops Build → Prove → commit, then a feature close runs Prove and Ship</text>
<g class="run"><rect x="40" y="538" width="14" height="14" rx="3"/></g>
<text class="l" text-anchor="start" x="60" y="545">Runs</text>
<g class="light"><rect x="130" y="538" width="14" height="14" rx="3"/></g>
<text class="l" text-anchor="start" x="150" y="545">Light version</text>
<g class="opt"><rect x="270" y="538" width="14" height="14" rx="3"/></g>
<text class="l" text-anchor="start" x="290" y="545">On request</text>
<circle class="dot" cx="397" cy="545" r="4"/>
<text class="l" text-anchor="start" x="410" y="545">Asks you at the end</text>
</svg>
